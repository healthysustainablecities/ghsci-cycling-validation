<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Cycling accessibility validation — interactive maps</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
<script src="https://cdn.jsdelivr.net/npm/driver.js@1.3.1/dist/driver.js.iife.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@1.3.1/dist/driver.css"/>
<style>
  /* Panel accents, mirroring the map colour constants defined in the script
     (LTS_COLOURS, ISO_COLORS, DISMOUNT_COLOR) so a control is shaded with the
     same hue as the thing it refers to. --pink-ring is a deepened 500 m pink:
     #faccfa itself is too pale to read as an outline on the white panel. */
  :root {
    --lts1:#1a9850;  --lts1-fill:rgba(26,152,80,.22);   /* LTS_COLOURS[1] */
    --pink:#faccfa;  --pink-fill:rgba(250,204,250,.45); /* ISO_COLORS[0], the 500 m band */
    --pink-ring:rgba(224,138,224,.95);
    --dm:#6a51a3;    --dm-fill:rgba(106,81,163,.78);    /* DISMOUNT_COLOR */
  }
  body { margin:0; font-family: system-ui, sans-serif; }
  #map { position:absolute; inset:0; }
  /* one panel that grows rightwards when the assessment opens: a single
     scrolling surface, so the legend and the assessment share one scrollbar */
  #panels { position:absolute; top:10px; left:10px; z-index:2; background:#fff;
            border-radius:8px; box-shadow:0 1px 6px rgba(0,0,0,.3);
            font-size:13px; max-height:calc(100vh - 40px); 
            overflow-y:auto; overflow-x: hidden;
            display:flex; align-items:flex-start; }
  #panel { padding:12px 14px; width:300px; flex:0 0 300px; }
  #sep { display:none; align-self:stretch; width:1px; background:#e3e3e3;
         margin:10px 0; flex:0 0 1px; }
  body.assessing #sep { display:block; }
  #panel select#variation {width: 70%;}
  #panel h1 { font-size:14px; margin:0 0 8px; }
  #panel label.row { display:block; margin:5px 0 1px; color:#444; font-size:12px; }
  #panel select { width:100%; margin:0 0 2px; padding:2px; }
  #panel .checks label { display:block; margin:4px 0; }
  #panel .subhead { display:block; margin:8px 0 1px; color:#777; font-size:10.5px;
                     text-transform:uppercase; letter-spacing:.04em; }
  #panelHeader {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
  }

  #panelHeader h1 {
    margin: 0;
    font-size: 14px;
  }

  /* Three vertical steps, cycled by #panelToggle: everything -> indicator
     controls hidden (legend, histogram and buttons still there) -> header only. */
  #panel.collapsed #panelBody {
    display: none;
  }

  /* optionally tighten spacing when collapsed */
  #panel.collapsed {
    padding-bottom: 8px;
  }

  #panel.collapsed2 > *:not(#panelHeader) {
    display: none;
  }
 #showing { margin:8px 0; padding:7px 8px; background:#f2f6fa; border-radius:6px;
             font-size:12px; line-height:1.35; }
  #showing b { font-size:12.5px; }
  #notice { color:#b00; font-size:12px; margin:4px 0; display:none; }
  button.small { font-size:12px; padding:2px 8px; border:1px solid #bbb; background:#fafafa;
                 border-radius:5px; cursor:pointer; }
  button.small:hover { background:#eee; }
  button.small.on { background:#20303f; color:#fff; border-color:#20303f; }
  .icon-btn { position:relative; width:26px; padding:2px 0; line-height:1.1;
              text-align:center; }
  /* transient confirmation bubble, so the icon does not have to change */
  #shareBtn.copied::after { content:'Link copied'; position:absolute; bottom:120%;
              left:50%; transform:translateX(-50%); background:rgba(20,20,20,.92);
              color:#fff; padding:3px 7px; border-radius:5px; font-size:11px;
              white-space:nowrap; z-index:3; }
  /* the two buttons that carry the task: the tour that explains it (LTS 1 green)
     and the activity itself (the 500 m batlow pink) */
  #tourBtn { background:var(--lts1-fill); border-color:var(--lts1); }
  #tourBtn:hover { background:rgba(26,152,80,.34); }
  #assessBtn { background:var(--pink-fill); border-color:var(--pink-ring); }
  #assessBtn:hover { background:rgba(250,204,250,.75); }
  #assessStatus { align-self:center; font-size:10.5px; color:#777; font-style:italic; }
  #assessStatus.part { color:#8a5a00; }
  #assessStatus.done { color:var(--lts1); font-style:normal; font-weight:600; }
  button.small[disabled] { opacity:.5; cursor:not-allowed; }
  button.small[disabled]:hover { background:#fafafa; }
  #infoBtn { border-radius:50%; width:22px; height:22px; padding:0; font-weight:bold;
             font-family:serif; font-style:italic; }
  .selrow { display:flex; gap:6px; align-items:flex-end; }
  .selrow > div { flex:1; }
  /* wrapper around Destination */
  .selrow > div:first-child {
    flex: 0 0 70%;
  }
  /* wrapper around Variation */
  .selrow > div:last-child {
    flex: 1 0 35%;
  }
  .selrow > div.info-wrap {
    flex: 0 0 35%;
  }
  /* centre contents of the second div */
  .info-wrap {
    display: flex;
    align-items: center;      /* vertical alignment */
    justify-content: center;  /* horizontal centre */
    gap: 4px;                 /* space between select and "i" */
  }
  .info-wrap select {
    width: auto;   /* or a % if you want the button closer/further */
  }
  .leg { margin-top:8px; }
  .leg-title { display:block; font-size:11.5px; color:#444; margin-bottom:2px; }
  .leg-row { display:flex; gap:2px; }
  .leg-item { flex:1; text-align:center; font-size:11px; cursor:pointer;
              border-radius:3px; padding:1px 0 0; }
  .leg-item .patch { display:block; height:12px; border-radius:2px; margin-bottom:1px; }
  .leg-item.static { cursor:default; }
  .leg-item.selected { outline:2px solid #222; outline-offset:1px; }
  .leg-item:not(.static):hover .patch { filter:brightness(0.92); }
  .histo-bars { display:flex; align-items:flex-end; gap:2px; height:58px;
                margin-top:14px; }
  .histo-bar { flex:1; position:relative; border-radius:2px 2px 0 0; min-height:2px; }
  .histo-val { position:absolute; top:-13px; left:0; right:0; text-align:center;
               font-size:9.5px; color:#333; white-space:nowrap; }
  .histo-x { display:flex; font-size:9.5px; color:#555; }
  .histo-x span { flex:1; text-align:center; }
  .histo-note { font-size:10.5px; color:#555; margin-top:2px; white-space: pre-line;}
  /* ---- route assessment: a second pane to the right of the legend ---- */
  #assess { padding:12px 14px; width:330px; flex:0 0 330px; display:none; }
  body.assessing #assess { display:block; }
  /* horizontal collapse leaves the legend as a slim bar holding its own
     re-open button, so the control never disappears from the page */
  body.legend-collapsed #panel { width:30px; flex:0 0 30px; padding:10px 5px;
                                 overflow:hidden; }
  body.legend-collapsed #panel > *:not(#panelHeader) { display:none; }
  body.legend-collapsed #panelHeader { justify-content:center; }
  body.legend-collapsed #panelHeader h1,
  body.legend-collapsed #panelHeader #infoBtn { display:none; }
  /* the sideways collapse is its own control, available at any time */
  /* the vertical collapse applies to whichever half is showing */
  #panel.collapsed ~ #assess #assessBody,
  #panel.collapsed ~ #assess #assessNav,
  #panel.collapsed ~ #assess #assessProg { display:none; }
  #assessHeader { display:flex; align-items:center; justify-content:space-between;
                  gap:4px; }
  #legendToggle { width:24px; padding:0 2px; }
  /* route legend (only while assessing) */
  .rleg-row { display:flex; align-items:center; gap:6px; font-size:11px;
              color:#333; margin:2px 0; }
  .rleg-key { width:28px; display:inline-flex; justify-content:center; }
  .pt-origin { display:inline-block; width:12px; height:12px; border-radius:50%;
               background:#ffd400; border:2px solid #000; }
  .rleg-cat { display:inline-flex; align-items:center; gap:3px; margin-right:8px; }
  .rleg-cat i { width:10px; height:10px; border-radius:50%; display:inline-block; }
  #assess h2 { font-size:14px; margin:0 0 2px; }
  #assessProg { font-size:11.5px; color:#666; margin-bottom:6px; }
  /* stage navigator across the parts of the validation activity */
  #assessNav { display:flex; gap:3px; margin:0 0 6px; }
  #assessNav button { flex:1; font-size:10.5px; padding:3px 1px; border:1px solid #bbb;
                      background:#fafafa; border-radius:4px; cursor:pointer; }
  #assessNav button.on { background:#20303f; color:#fff; border-color:#20303f; }
  /* The four network scenarios as one horizontal row, shared by Parts A and B.
     Answered ones are shaded LTS 1 green and the pink ring marks what to answer
     next, so completion and the next action read at a glance. Selection is an
     outline rather than a fill, so a scenario can be selected and complete at once. */
  .net-btns { display:flex; gap:3px; margin:6px 0 4px; }
  .net-btns button { flex:1; font-size:10.5px; line-height:1.2; padding:4px 2px;
                     border:1px solid #bbb; background:#fafafa; border-radius:4px;
                     cursor:pointer; }
  .net-btns button:hover { background:#eee; }
  .net-btns button.done { background:var(--lts1-fill); border-color:var(--lts1); }
  .net-btns button.on { border:2px solid #20303f; padding:3px 1px; font-weight:700; }
  .net-btns button.next, .nav button.next { box-shadow:0 0 0 2px var(--pink-ring); }
  /* the question, and the yes/no (or no/unsure/yes) answer */
  .q { margin:9px 0 0; font-size:11.5px; line-height:1.35; }
  .q b { display:block; margin-bottom:3px; }
  .q .assume { color:#444; font-style:italic; }
  .yn { display:flex; gap:6px; margin:5px 0 2px; }
  .yn label { flex:1; text-align:center; border:1px solid #ccc; border-radius:5px;
              padding:3px 0; cursor:pointer; background:#fafafa; font-size:11.5px; }
  .yn input { display:none; }
  .yn label:has(input:checked) { background:#20303f; border-color:#20303f;
                                 color:#fff; font-weight:700; }
  /* dest_wrong is a heading for the three destination types, not an option itself */
  .issue-head { font-size:11.5px; margin:2px 0 0; color:#333; }
  .subchecks { margin-left:18px; }
  .nudge { color:#a33; font-size:10.5px; margin-top:5px; }
  .hintline { font-size:10.5px; color:#555; line-height:1.35; margin:5px 0 0; }
  #assess .intro { font-size:11.5px; line-height:1.4; }
  #assess .intro p { margin:5px 0; }
  /* border-box, or the 100% width plus padding and border spills past the panel */
  #assess input[type=text] { width:100%; font-size:11.5px; font-family:inherit;
                             border:1px solid #ccc; border-radius:4px; padding:3px;
                             box-sizing:border-box; }
  table.rt { width:100%; border-collapse:collapse; font-size:11px; margin-top:4px; }
  table.rt th { font-weight:600; color:#555; text-align:right; padding:1px 2px;
                font-size:10px; }
  table.rt th.l, table.rt td.l { text-align:left; }
  table.rt td { padding:1px 2px; text-align:right;
                font-variant-numeric:tabular-nums; }
  table.rt tr.cur td { background:#eef4fa; }
  table.rt td.dim, table.rt th.dim { color:#aaa; }
  table.rt th.selcol, table.rt td.selcol { background:#e8f0f8; font-weight:600;
                                           color:#123; }
  table.rt th.selcol { border-radius:4px 4px 0 0; }
  table.rt tr:last-child td.selcol { border-radius:0 0 4px 4px; }
  .bd { margin:5px 0; font-size:11px; }
  .bd > b { font-size:11.5px; }
  .bd-x { color:#555; margin-left:15px; font-size:10px; font-weight:400;
          line-height:1.3; }
  .dm-x { color:#6a51a3; margin-left:15px; font-size:10px; font-weight:400;
          line-height:1.3; }
  .maplbl { background:rgba(255,255,255,.92); border-left:4px solid #888;
            border-radius:3px; padding:1px 5px; font-size:10.5px; color:#222;
            white-space:nowrap; box-shadow:0 1px 3px rgba(0,0,0,.3);
            pointer-events:none; }
  .rkey { display:flex; gap:14px; font-size:10.5px; color:#555; margin-top:4px; }
  .rkey span { display:inline-flex; align-items:center; gap:4px; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%;
         margin-right:4px; vertical-align:-1px; }
  #assess fieldset { border:1px solid #ddd; border-radius:6px; padding:6px 8px;
                     margin:8px 0 0; }
  /* a "No" with no reason yet: the answer is not complete until one is ticked */
  #assess fieldset.need { border-color:#a33; }
  #assess fieldset.need legend { color:#a33; font-weight:600; }
  #assess legend { font-size:11px; color:#444; padding:0 4px; }
  #assess fieldset label { display:block; font-size:11.5px; margin:2px 0; }
  #assess textarea { width:100%; font-size:11.5px; font-family:inherit;
                     border:1px solid #ccc; border-radius:4px; padding:3px;
                     box-sizing:border-box; }
  .nav { display:flex; gap:6px; margin-top:8px; }
  .nav button { flex:1; }
  
  .dist-label, .time-label {
    display: block;        /* each label on its own line */
    white-space: nowrap;   /* don't wrap within the label itself */
    line-height: 1.1;
  }

  .dist-label {
    /* optional tweaks */
  }

  .time-label {
    font-size: 10px;
    color: #555;
  }
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:10; display:none;
              align-items:center; justify-content:center; }
  .modal { background:#fff; border-radius:10px; padding:18px 20px; max-width:560px;
           max-height:80vh; overflow-y:auto; font-size:13.5px; line-height:1.5; }
  .modal h2 { font-size:15px; margin:0 0 8px; }
  .modal h3 { font-size:13px; margin:12px 0 4px; }
  #reportView { position:fixed; inset:0; z-index:9; background:#fff; display:none;
                flex-direction:column; }
  #reportView iframe { flex:1; border:0; width:100%; }
  #reportBar { padding:6px 12px; background:#20303f; color:#fff; display:flex;
               justify-content:space-between; align-items:center; font-size:13px; }
  #reportBar button { background:#fff; }
  /* Part C, in the side panel alongside the map: a rater judging whether the
     method suits their city should still be able to look at their city. Three
     narrow columns fit 330px because each scale is a three-way switch rather
     than a dropdown — which also halves the clicks. */
  #assess h3 { font-size:12.5px; margin:12px 0 1px; color:#20303f; }
  #assess .ghint { font-size:10.5px; color:#666; margin:0 0 4px; line-height:1.3; }
  .ck-head, .ck-row { display:flex; align-items:center; gap:3px; }
  .ck-head { font-size:9.5px; color:#555; font-weight:600; text-align:center;
             border-bottom:1px solid #ddd; padding-bottom:2px; }
  .ck-row { font-size:10.5px; padding:2px 0; border-bottom:1px solid #f2f2f2;
            touch-action:none; user-select:none; }
  .ck-row.dragging { opacity:.55; }
  /* the rank number belongs to the position, not the item: it stays put and the
     rest of the row moves past it, so the column always reads 1..n */
  .rk-n { flex:0 0 12px; color:#555; font-variant-numeric:tabular-nums;
          text-align:right; }
  .ck-grip { flex:0 0 10px; color:#bbb; font-size:9px; text-align:center;
             cursor:grab; }
  .ck-row.dragging .ck-grip { cursor:grabbing; }
  .ck-lab { flex:1; min-width:0; line-height:1.25; text-align:left; cursor:grab; }
  .ck-sc, .ck-sw { flex:0 0 63px; display:flex; gap:1px; }
  /* a rule between the two response columns, with room either side of it */
  .ck-c2 { border-left:1px solid #ddd; margin-left:9px; padding-left:9px; }
  .ck-sw button { flex:1; font-size:9.5px; line-height:1.4; padding:1px 0;
                  border:1px solid #ccc; background:#fafafa; border-radius:3px;
                  cursor:pointer; color:#333; }
  .ck-sw button:hover { background:#eee; }
  /* selected values take the batlow ramp used by the distance bands, pink positive */
  .ck-sw button.sel[data-v="-1"] { background:#011959; border-color:#011959; color:#fff; }
  .ck-sw button.sel[data-v="0"]  { background:#a8963c; border-color:#a8963c; color:#fff; }
  .ck-sw button.sel[data-v="1"]  { background:var(--pink); border-color:var(--pink-ring);
                                   color:#3a123a; font-weight:700; }
  .ck-na { flex:0 0 63px; text-align:center; color:#bbb; font-size:10px; }
  .ck-rank-h { flex:0 0 25px; text-align:center; }
  .ck-other { width:100%; font-size:11px; font-family:inherit; border:1px solid #ccc;
              border-radius:4px; padding:3px; margin-top:4px; box-sizing:border-box; }
  .ck-help { border-bottom:1px dotted #999; cursor:help; }
  #hoverTip { position:fixed; pointer-events:none; background:rgba(20,20,20,.92);
              color:#fff; padding:5px 9px; border-radius:6px; font-size:11.5px;
              max-width:240px; z-index:6; display:none; line-height:1.4; }
  /* scratch ruler readout: bottom-right, clear of the nav control and attribution */
  #measureBox { position:fixed; bottom:36px; right:12px; z-index:5; display:none;
                background:rgba(255,255,255,.96); border:1px solid #bbb;
                border-radius:8px; padding:8px 10px; font-size:11.5px;
                box-shadow:0 2px 8px rgba(0,0,0,.25); min-width:170px; }
  #measureTotal { font-size:17px; font-weight:700; color:#20303f; line-height:1.1; }
  #measureSub { color:#555; margin-top:2px; line-height:1.35; }
  #measureBtns { display:flex; gap:5px; margin-top:7px; }
  #measureBtns button { flex:1; }
  /* !important, because the hover handlers set cursor inline on the canvas */
  body.measuring #map canvas { cursor:crosshair !important; }
  .maplibregl-popup-content { font-size:12px; max-width:320px; padding:10px 12px 8px; }
  .popup h4 { margin:0 0 2px; font-size:12.5px; }
  .popup .sub { color:#555; margin:0 0 6px; font-size:11.5px; }
  .popup h5 { margin:8px 0 2px; font-size:11.5px; color:#333; }
  .popup table { width:100%; border-collapse:collapse; }
  .popup td { padding:1px 0; font-size:11.5px; }
  .popup td.v { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;
                padding-left:10px; }
  .popup tr.sel td { font-weight:700; }
  .swatch { display:inline-block; width:11px; height:11px; border-radius:2px;
            vertical-align:-1px; margin-right:4px; }
</style>
</head>
<body>
<div id="panels">
  <div id="panel">
  <div id="panelHeader">
    <h1>Cycling access validation</h1>
    <button id="infoBtn" class="small">i</button>
    <button id="legendToggle" class="small" title="Hide the legend">&#9664;</button>
    <button id="panelToggle" class="small" title="Hide the indicator selection details">⭫</button>
    
  </div>
  <div id="showing"></div>
  <label class="row">City</label>
  <select id="city"></select>
  <div id="panelBody">

    <label class="row">Indicator</label>
    <select id="threshold"></select>

    <div id="gapBandRow" style="display:none">
      <label class="row">Distance threshold</label>
      <select id="gapBand"></select>
    </div>

    <div class="selrow">
      <div>
        <label class="row">Destination</label>
        <select id="concept"></select>
      </div>
      <div>
        <label class="row">Variation</label>
        <select id="variation">
          <option value="strict" selected>Strict</option>
          <option value="lenient">Lenient</option>
        </select>
      </div>
    </div>
      <label class="row">Network</label>
      <select id="network"></select>
    <div id="notice"></div>

    <div class="checks">
      <label><input type="checkbox" id="ltsChk" checked> Level of Traffic Stress (LTS) network</label>
      <label><input type="checkbox" id="gridChk" checked> Grid access choropleth</label>
      <label id="dismountChkRow" style="display:none"><input type="checkbox" id="dismountChk"> Dismount priority links</label>
      <label><input type="checkbox" id="destChk"> Show indicator destinations</label>
      <span class="subhead">Region context</span>
      <label><input type="checkbox" id="boundaryChk" checked> Study region boundary</label>
      <label><input type="checkbox" id="bufferChk"> 5 km analysis buffer</label>
    </div>
    <label class="row">Basemap</label>
    <select id="basemap">
      <option value="sat">Satellite (grayscale)</option>
      <option value="positron" selected>Positron</option>
    </select>
  </div>
  <div id="panelFooter">

    <div class="leg">
      <span class="leg-title">Level of Traffic Stress (LTS)</span>
      <div id="ltsLegend" class="leg-row"></div>
    </div>

    <div class="leg">
      <span class="leg-title" id="accLegendTitle" title="50% of population access to destination by distance band (m) using selected network">Access within distance (m)</span>
      <div id="accLegend" class="leg-row"></div>
      <div id="accLegendTimes" class="leg-row leg-row-secondary"></div>
    </div>

    <div class="leg" id="histo" style="display:none">
      <span class="leg-title" id="histoTitle"></span>
      <div class="histo-bars" id="histoBars"></div>
      <div class="histo-x" id="histoX"></div>
      <div class="histo-note" id="histoNote"></div>
    </div>

    <div style="margin-top:10px; display:flex; gap:6px; flex-wrap:wrap" id="actionBtns">
      <button class="small icon-btn" id="shareBtn" title="Copy share link"
              aria-label="Copy share link">&#128279;</button>
      <button class="small" id="tourBtn">Tour</button>
      <button class="small" id="assessBtn" style="display:none">Validation activity</button>
      <span id="assessStatus"></span>
      <button class="small" id="reportBtn" style="display:none">View validation report</button>
      <button class="small" id="measureBtn"
              title="Click successive points on the map to accumulate straight-line distance, for your own reference">Measure distance (m)</button>
  </div>
  <div id="round1" style="margin-top:6px; font-size:11.5px; display:none">
    </div>

  </div>
  </div>

  <div id="sep"></div>
  <div id="assess">
    <div id="assessHeader">

<script>
// dar_es_salaam_custom withdrawn 2026-08-07: its study region database no longer
// exists, so it could not be re-run for the staircase-routability correction
// (steps/corridor excluded unless ramp:bicycle). Listing it alongside corrected
// cities would invite comparisons across two different methods. Restore the slug
// once that region has been re-analysed.
const CITY_SLUGS = ['wurzburg', 'dar_es_salaam', 'melbourne', 'minneapolis', 'mexico_city', 'mexico_city_proper', 'helsinki'].sort();

const CONCEPTS = {
  food: { label: 'Fresh food / market', strict: 'fresh_food_market', lenient: 'fresh_food_pooled' },
  pt:   { label: 'Public transport', strict: 'pt_frequent', lenient: 'pt_any' },
  pos:  { label: 'Public open space entry points', strict: 'public_open_space_large', lenient: 'public_open_space_any' },
  ac:   { label: 'Activity centres', strict: 'activity_centre_complete', lenient: 'activity_centre_local' },
  all:  { label: 'All destinations (combined)', strict: 'all_strict', lenient: 'all_lenient' },
};
const IND_LABELS = {
  fresh_food_market: 'Fresh food / market',
  fresh_food_pooled: 'Fresh food (incl. convenience)',
  pt_frequent: 'Public transport (frequent)',
  pt_any: 'Public transport (any)',
  public_open_space_large: 'Public open space entries (large)',
  public_open_space_any: 'Public open space entries (any)',
  activity_centre_complete: 'Activity centres (complete)',
  activity_centre_local: 'Activity centres (local)',
  all_strict: 'All destinations (strict)',
  all_lenient: 'All destinations (lenient)',
};
const IND_ORDER = Object.keys(IND_LABELS);
const NETWORKS = {
  lts1_: { label: 'Low stress (LTS 1), allowing dismount',
           desc: 'routes restricted to the lowest-stress streets only (LTS 1) for their full length' },
  ride_: { label: 'Low stress (LTS 1–2), without dismount',
           desc: 'routes restricted to low-stress streets (LTS 1–2) that can be ridden the whole way — links where the rider would have to get off and walk the bike are excluded' },
  safe_: { label: 'Low stress (LTS 1–2), allowing dismount',
           desc: 'routes restricted to low-stress streets (LTS 1–2) for their full length, walking the bike where a footway link is the only low-stress connection (walked distance counted three times over)' },
  '':    { label: 'Stress penalty, allowing dismount',
           desc: 'routes over the full cycleable network, with length along higher-stress (LTS 3–4) streets penalised by a factor of 1.25 — a benefit-of-the-doubt measure' },
};
// The paired with/without-dismount contrast is not a routed network of its own but a
// derived comparison of the two above, so it is offered as an indicator type rather
// than a network.
const DMGAP = 'dmgap_';
// Threshold selects the *display mode*: isochrone bands (all four distances at once,
// matching the static report), a continuous average-distance map, or the
// dismount-dependence contrast.
const THRESHOLDS = {
  iso: 'Access within distance/time',
  avg: 'Average distance to nearest',
  dmgap: 'Dismount dependence (with vs without)',
};
// dismount-dependence classes: % of a cell's sample points whose access exists only
// because the rider may get off and walk.  Bounds match GAP_CLASSES in
// _export_validation_tiles.py so the map and its histogram agree.
const GAP_BREAKS = [0, 10, 25, 50];
const GAP_COLORS = ['#eeeeee', '#dadaeb', '#bcbddc', '#9e9ac8', '#6a51a3'];
const GAP_LABELS = ['none', '≤ 10%', '≤ 25%', '≤ 50%', '> 50%'];
// Round 1 (2025) validation web maps, for reference where they exist.
// Two layouts on that site: a single map per city, or separate 2 km / 5 km maps.
// Dar es Salaam has no entry — it was first analysed in Round 2.
const ROUND1_BASE = 'https://mahsaall.github.io/CyclingAccessibilityValidation';
const ROUND1 = {
  wurzburg: { '': 'Wurzburg/index.html' },
  melbourne: { '2 km': 'Melbourne/Melbourne2km/index.html',
               '5 km': 'Melbourne/Melbourne5km/index.html' },
  minneapolis: { '2 km': 'Minneapolis/Minneapolis2km/index.html',
                 '5 km': 'Minneapolis/Minneapolis5km/index.html' },
  // remaining Round 1 cities, for when they are added to this dashboard
  // (slugs assumed from city name — verify when each is first published)
  barcelona: { '': 'Barcelona/index.html' },
  chennai: { '': 'Chennai/index.html' },
  curitiba: { '': 'Curitiba/index.html' },
  helsinki: { '': 'Helsinki/index.html' },
  tarragona: { '': 'Tarragona/index.html' },
  turin: { '': 'Turin/index.html' },
  valencia: { '': 'Valencia/index.html' },
  mexico_city: { '2 km': 'MexicoCity/MexicoCity2km/index.html',
                 '5 km': 'MexicoCity/MexicoCity5km/index.html' },
  suzhou: { '2 km': 'Suzhou/Suzhou2km/index.html',
            '5 km': 'Suzhou/Suzhou5km/index.html' },
};

const ISO_DISTANCES = ['500m', '1000m', '2000m', '5000m'];
// Exact Crameri batlow samples at t=1.0/0.667/0.333/0.0, matching
// _validation_report.py's _plot_isochrone_ax so the dashboard and static
// report read as the same colour language.
const ISO_COLORS = ['#faccfa', '#d29343', '#3c6d56', '#011959'];
const ISO_NO_ACCESS = '#888888';
const IND_DESCS = {
  fresh_food_market: 'a fresh food market or supermarket',
  fresh_food_pooled: 'any fresh food source — markets and supermarkets pooled with convenience stores (lenient definition)',
  pt_frequent: 'a public transport stop with a scheduled service at least every 20 minutes (strict definition)',
  pt_any: 'any public transport stop',
  public_open_space_large: 'an entry point to a large (>1.5 ha) public open space (strict definition)',
  public_open_space_any: 'an entry point to any public open space',
  activity_centre_complete: 'a “complete” activity centre — a network location whose 400 m walking catchment contains a strict-definition destination of every category (fresh food, public open space, frequent public transport)',
  activity_centre_local: 'a “local” activity centre — a network location whose 400 m walking catchment contains a lenient-definition destination of every category (fresh food incl. convenience, any public open space, any public transport)',
  all_strict: 'at least one destination of every category (fresh food, public open space, public transport), each at its strict definition',
  all_lenient: 'at least one destination of every category (fresh food, public open space, public transport), each at its lenient definition',
};

// which overlay layers + destination-point filters each indicator maps to
const DEST_OVERLAYS = {
  fresh_food_market: { dest: ['fresh_food_market'] },
  fresh_food_pooled: { dest: ['fresh_food_market', 'convenience'] },
  pt_any: { dest: ['pt_any'] },
  pt_frequent: { ptfreq: true },
  public_open_space_large: { pos_large: true },
  public_open_space_any: { pos_any: true },
  activity_centre_complete: { ac_complete: true },
  activity_centre_local: { ac_local: true },
  all_strict: { dest: ['fresh_food_market'], ptfreq: true, pos_large: true },
  all_lenient: { dest: ['fresh_food_market', 'convenience', 'pt_any'], pos_any: true },
};
const OVERLAY_COLORS = {
  dest_pts: '#e6194b', ptfreq_pts: '#e6194b',
  pos_any_pts: '#f032e6', pos_large_pts: '#f032e6',
  ac_local_pts: '#f032e6', ac_complete_pts: '#f032e6',
};

const DISMOUNT_COLOR = '#6a51a3';
const BATLOW = ['#011959', '#10505f', '#3c7156', '#a8963c', '#f9a380', '#fdb4c7'];
const LTS_COLOURS = { 1: '#1a9850', 2: '#a6d96a', 3: '#fdae61', 4: '#d73027' };
const LTS_LABELS = { 1: 'lowest stress, suitable for all', 2: 'low stress',
                     3: 'moderate stress', 4: 'high stress' };
const DIM_COLOR = '#999999';

const protocol = new pmtiles.Protocol();
maplibregl.addProtocol('pmtiles', protocol.tile);

const $ = id => document.getElementById(id);
const manifests = {};
let map, cols = new Set(), slug = null, hasReport = false;
// legend-click "isolate" state: null, or { kind: 'lts', value: 1..4 }
// or { kind: 'iso', value: 0..3 (distance band) | 4 (no access) }
let isolated = null;

// ---- shareable URL state (#city=…&d=…&v=…&t=…&n=…&l=…&b=…&m=zoom/lat/lng) ----
const LAYER_CHECKS = ['ltsChk', 'gridChk', 'destChk', 'boundaryChk', 'bufferChk',
                      'dismountChk'];
// the zoom every city opens at, unless a share link carries its own camera
const DEFAULT_ZOOM = 11;
const initialState = location.hash.length > 1
  ? new URLSearchParams(location.hash.slice(1)) : null;
let initialCameraPending = !!(initialState && initialState.get('m'));

function updateHash() {
  if (!map || !slug) return;
  const p = new URLSearchParams();
  p.set('city', slug);
  p.set('d', $('concept').value);
  p.set('v', $('variation').value);
  p.set('t', $('threshold').value);
  p.set('n', $('network').value);
  if ($('threshold').value === 'dmgap') p.set('g', $('gapBand').value);
  p.set('l', LAYER_CHECKS.filter(id => $(id).checked).join('.'));
  p.set('b', $('basemap').value);
  const c = map.getCenter();
  p.set('m', `${map.getZoom().toFixed(2)}/${c.lat.toFixed(5)}/${c.lng.toFixed(5)}`);
  history.replaceState(null, '', '#' + p.toString());
}

function applyInitialControls() {
  if (!initialState) return;
  const setIf = (id, val, ok) => { if (val !== null && ok(val)) $(id).value = val; };
  setIf('concept', initialState.get('d'), v => v in CONCEPTS);
  setIf('variation', initialState.get('v'), v => ['strict', 'lenient'].includes(v));
  const rawT = initialState.get('t');
  setIf('threshold', rawT, v => v in THRESHOLDS);
  // back-compat with pre-isochrone share links that stored a distance (e.g. "2000m")
  if (rawT && /^\d+m$/.test(rawT)) $('threshold').value = 'iso';
  const n = initialState.get('n');
  if (n !== null && n in NETWORKS) $('network').value = n;
  setIf('gapBand', initialState.get('g'), v => ISO_DISTANCES.includes(v));
  const l = initialState.get('l');
  if (l !== null) {
    const on = l.split('.');
    for (const id of LAYER_CHECKS) $(id).checked = on.includes(id);
  }
  setIf('basemap', initialState.get('b'), v => ['sat', 'positron'].includes(v));
}

// Population-weighted region value for a grid column, as recorded in the manifest
// from indicators_region's pop_ prefixed column — the same number the written
// validation report quotes.  This is the *mean share*: each cell contributes the
// share of its sample points with access, weighted by its population.  It is not
// the same as summing the mapped bands, which classify a whole cell by whether
// >= 50% of its sample points have access and so round every partially-served
// cell up or down (up to ~4 pp apart in Wurzburg).  Always quote this for
// "N% of residents ..."; the bands describe the map, not the population.
function regionValue(col) {
  const v = ((manifests[slug] || {}).region_values || {})[col];
  return (v === undefined || v === null) ? null : v;
}

function pctCol(net, ind, distm) { return `pct_access_cycle_${net}${ind}_${distm}`; }
function avgCol(net, ind) { return `avg_cycle_dist_${net}${ind}`; }
// mean extra riding distance needed to reach the destination without dismounting,
// over the sample points reachable both ways
function extraCol(ind) { return `avg_cycle_extra_${DMGAP}${ind}`; }
function currentIndicator() {
  const c = CONCEPTS[$('concept').value];
  return c[$('variation').value];
}
function gapBand() { return $('gapBand').value || '2000m'; }
// "reference" column for region-overall stat / fallback lookups: the 2 km band
// in isochrone mode (a stable single number), the avg-distance column, or the
// dismount-dependence gap at the selected band.
function currentColumn() {
  const net = $('network').value, ind = currentIndicator();
  const mode = $('threshold').value;
  if (mode === 'avg') return avgCol(net, ind);
  if (mode === 'dmgap') return pctCol(DMGAP, ind, gapBand());
  return pctCol(net, ind, '2000m');
}

function fillSelect(sel, entries) {
  sel.innerHTML = '';
  for (const [v, label] of entries) sel.add(new Option(label, v));
}

function hasIsoData(net, con, vari) {
  return cols.has(pctCol(net, CONCEPTS[con][vari], '2000m'));
}
function hasAvgData(net, con, vari) {
  return cols.has(avgCol(net, CONCEPTS[con][vari]));
}
// the dismount contrast is derived, so it does not depend on the network selection
function hasGapData(con, vari) {
  return cols.has(pctCol(DMGAP, CONCEPTS[con][vari], '2000m'));
}
function hasModeData(mode, net, con, vari) {
  if (mode === 'dmgap') return hasGapData(con, vari);
  return mode === 'avg' ? hasAvgData(net, con, vari) : hasIsoData(net, con, vari);
}

// grey out options that have no data for this city given the other current picks
function refreshAvailability() {
  const net = $('network').value, vari = $('variation').value,
        con = $('concept').value, mode = $('threshold').value;
  const gapMode = mode === 'dmgap';
  for (const o of $('network').options)
    o.disabled = !hasModeData(mode, o.value, con, vari);
  for (const o of $('threshold').options)
    o.disabled = !hasModeData(o.value, net, con, vari);
  for (const o of $('variation').options)
    o.disabled = !hasModeData(mode, net, con, o.value);
  for (const o of $('concept').options)
    o.disabled = !['strict', 'lenient'].some(v => hasModeData(mode, net, o.value, v));
  // in dismount-dependence mode the comparison is fixed (LTS 1–2 with vs without
  // dismounting), so the network picker has nothing to choose
  $('network').disabled = gapMode;
  $('gapBandRow').style.display = gapMode ? '' : 'none';
  for (const o of $('gapBand').options)
    o.disabled = !cols.has(pctCol(DMGAP, CONCEPTS[con][vari], o.value));
  if (gapMode && $('gapBand').selectedOptions[0]
      && $('gapBand').selectedOptions[0].disabled) {
    const first = [...$('gapBand').options].find(o => !o.disabled);
    if (first) $('gapBand').value = first.value;
  }
}

// if the current combination has no data, walk to the nearest valid one
function autofix() {
  const con = $('concept').value;
  if (hasModeData($('threshold').value, $('network').value, con, $('variation').value)) return true;
  for (const mode of [$('threshold').value, 'iso', 'avg', 'dmgap'])
    for (const vari of [$('variation').value, 'strict', 'lenient'])
      for (const net of [$('network').value, 'safe_', '', 'lts1_', 'ride_'])
        if (hasModeData(mode, net, con, vari)) {
          $('threshold').value = mode; $('variation').value = vari; $('network').value = net;
          return true;
        }
  return false;
}

function showingText() {
  const ind = currentIndicator(), mode = $('threshold').value, net = $('network').value;
  let body;
  if (mode === 'dmgap') {
    body = `Each grid cell is coloured by the share of its sample points that can only reach the destination within ${gapBand().replace('m', ' m')} because the rider may get off and walk the bike — the low-stress (LTS 1–2) route with dismounting compared with the same route ridden throughout.`;
  } else if (mode === 'avg') {
    body = `Average network distance (m) from each grid cell’s sample points to the nearest destination — ${NETWORKS[net].label} routing.`;
  } else {
    body = `Each grid cell is coloured by the closest distance band (500 m / 1000 m / 2000 m / 5000 m) at which at least half its sample points have access — ${NETWORKS[net].label} routing.`;
  }
  return `<b>${IND_LABELS[ind]}</b><br>${body}`;
}

// ---- population-distribution histogram (replaces the "Region overall" line) ----
function _lerpHex(a, b, t) {
  const pa = [1, 3, 5].map(i => parseInt(a.slice(i, i + 2), 16));
  const pb = [1, 3, 5].map(i => parseInt(b.slice(i, i + 2), 16));
  return '#' + pa.map((v, i) => Math.round(v + (pb[i] - v) * t)
    .toString(16).padStart(2, '0')).join('');
}
function _batlowAt(t) { // t in [0,1] along the reversed (pale->dark) ramp
  const ramp = [...BATLOW].reverse();
  const x = Math.max(0, Math.min(1, t)) * (ramp.length - 1);
  const i = Math.min(Math.floor(x), ramp.length - 2);
  return _lerpHex(ramp[i], ramp[i + 1], x - i);
}
function renderRound1(s) {
  const el = $('round1');
  const entry = ROUND1[s];
  if (!entry) { el.style.display = 'none'; el.innerHTML = ''; return; }
  const links = Object.entries(entry).map(([label, path]) =>
    `<a href="${ROUND1_BASE}/${path}" target="_blank" rel="noopener">` +
    `${label ? 'Round 1 map (' + label + ')' : 'Round 1 map'}</a>`).join(' · ');
  el.innerHTML = `<span style="color:#555">For reference: </span>${links}`;
  el.style.display = 'block';
}

function renderHisto() {
  const wrap = $('histo');
  const mode = $('threshold').value;
  const family = mode === 'dmgap' ? DMGAP : $('network').value;
  const dist = ((manifests[slug] || {}).distributions || {})[family + currentIndicator()] || {};
  if (!$('gridChk').checked) { wrap.style.display = 'none'; return; }
  const maxBar = 52; // px, tallest bar
  if (mode === 'dmgap') {
    const shares = (dist.gap || {})[gapBand()];
    if (!shares) { wrap.style.display = 'none'; return; }
    const peak = Math.max(...shares, 1);
    $('histoTitle').textContent = 'Share of population by dismount dependence';
    $('histoBars').innerHTML = shares.map((v, i) =>
      `<div class="histo-bar" style="height:${Math.max(2, v / peak * maxBar)}px;` +
      `background:${GAP_COLORS[i]}"><span class="histo-val">${v}%</span></div>`).join('');
    $('histoX').innerHTML = GAP_LABELS.map(l => `<span>${l}</span>`).join('');
    const anywhere = shares.slice(1).reduce((a, b) => a + b, 0);
    // headline = the population-weighted mean share (the report's number); the
    // "lives in a cell with any dependence" figure the bars add up to is a much
    // larger, coarser quantity, so it is labelled as such rather than led with
    const gap = regionValue(pctCol(DMGAP, currentIndicator(), gapBand()));
    const band = gapBand().replace('m', ' m');
    // a city whose network has no walk-only links at all (e.g. where footways are
    // not mapped as banning cycling) has nothing to compare — say so, rather than
    // leaving an entirely unshaded map to be read as missing data
    $('histoNote').textContent = anywhere === 0
      ? 'No access in this city depends on dismounting: this network has no ' +
        'low-stress links that a rider would have to get off and walk.'
      : (gap === null
          ? `${anywhere.toFixed(1)}% of residents live where some access within ` +
            `${band} depends on dismounting`
          : `${gap.toFixed(1)}% of residents' access within ${band} depends on ` +
            `dismounting\n${anywhere.toFixed(1)}% live in a cell where any of it does`)
        + (dist.extra_mean !== undefined
          ? `\nfor the ${dist.extra_pop_pct}% who can ride around the walked links, ` +
            `doing so adds ${dist.extra_mean.toLocaleString()} m on average`
          : '');
    wrap.style.display = 'block';
    return;
  }
  // Bars and headline both come from the region's population-weighted mean shares.
  // Those are cumulative (access within 500 m implies access within 1000 m, at the
  // sample point and so after averaging), so successive differences give the share
  // of residents whose *nearest* such destination falls in each band, and the
  // remainder to 100% is the share with none within the largest threshold.  The
  // bars therefore sum to 100 and the headline is their running total.  Older
  // manifests without region_values fall back to the exported iso distribution,
  // which classifies each cell by where >= 50% of its sample points have access.
  const isoBars = () => {
    const net = $('network').value, ind = currentIndicator();
    const cum = ISO_DISTANCES.map(d => regionValue(pctCol(net, ind, d)));
    if (cum.some(v => v === null)) return dist.iso ? { bars: dist.iso, cum: null } : null;
    const bars = [];
    let prev = 0;
    for (const v of cum) { bars.push(Math.max(0, v - prev)); prev = v; }
    bars.push(Math.max(0, 100 - prev));
    return { bars, cum };
  };
  const iso = mode === 'iso' ? isoBars() : null;
  if (mode === 'iso' && iso) {
    const colors = [...ISO_COLORS, ISO_NO_ACCESS];
    const labels = ['500 m', '1000 m', '2000 m', '5000 m', 'None'];
    const peak = Math.max(...iso.bars, 1);
    $('histoTitle').textContent = 'Share of population by access band';
    $('histoBars').innerHTML = iso.bars.map((v, i) =>
      `<div class="histo-bar" style="height:${Math.max(2, v / peak * maxBar)}px;background:${colors[i]}">` +
      `<span class="histo-val">${v.toFixed(1)}%</span></div>`).join('');
    $('histoX').innerHTML = labels.map(l => `<span>${l}</span>`).join('');
    const running = n => iso.bars.slice(0, n).reduce((a, b) => a + b, 0);
    const pct2000 = iso.cum ? iso.cum[ISO_DISTANCES.indexOf('2000m')] : running(3);
    const pct5000 = iso.cum ? iso.cum[ISO_DISTANCES.indexOf('5000m')] : running(4);
    $('histoNote').textContent =
      pct2000.toFixed(1) + '% of residents have access within 2000 m (~10 min cycling)\n' +
      pct5000.toFixed(1) + '% of residents have access within 5000 m (~25 mins cycling)';
    wrap.style.display = 'block';
  } else if (mode === 'avg' && dist.avg) {
    const a = dist.avg;
    const n = a.shares.length;
    const peak = Math.max(...a.shares, 1);
    $('histoTitle').textContent = 'Reachable population by distance to nearest (m)';
    $('histoBars').innerHTML = a.shares.map((v, i) =>
      `<div class="histo-bar" style="height:${Math.max(2, v / peak * maxBar)}px;` +
      `background:${_batlowAt((i + 0.5) / n)}" title="${(i * a.bin_m).toLocaleString()}–${((i + 1) * a.bin_m).toLocaleString()} m: ${v}%"></div>`).join('');
    // break labels: 0 at the lower end, then every second bin edge, 5000+ at the top
    $('histoX').innerHTML = a.shares.map((_, i) => {
      if (i === 0) return '<span style="text-align:left">0</span>';
      if (i === n - 1) return `<span style="text-align:right">${a.max_m.toLocaleString()}+</span>`;
      return `<span>${i % 2 === 0 ? (i * a.bin_m).toLocaleString() : ''}</span>`;
    }).join('');
    $('histoNote').textContent =
      `25% of the population have access within ${a.p25.toLocaleString()} m\n` +
      `50% of the population have access within ${a.p50.toLocaleString()} m\n` +
      `75% of the population have access within ${a.p75.toLocaleString()} m`;
    wrap.style.display = 'block';
  } else {
    wrap.style.display = 'none';
  }
}

function isoExpression(net, ind) {
  const c = ISO_DISTANCES.map(d => pctCol(net, ind, d));
  return ['case',
    ['>=', ['coalesce', ['get', c[0]], -1], 50], ISO_COLORS[0],
    ['>=', ['coalesce', ['get', c[1]], -1], 50], ISO_COLORS[1],
    ['>=', ['coalesce', ['get', c[2]], -1], 50], ISO_COLORS[2],
    ['>=', ['coalesce', ['get', c[3]], -1], 50], ISO_COLORS[3],
    ISO_NO_ACCESS,
  ];
}

// dismount dependence: % of a cell's sample points whose access at the selected
// band exists only because the rider may walk the bike
function gapExpression(ind, band) {
  const v = ['coalesce', ['get', pctCol(DMGAP, ind, band)], -1];
  return ['case',
    ['<', v, 0], 'rgba(0,0,0,0)',
    ['<=', v, GAP_BREAKS[0]], GAP_COLORS[0],
    ['<=', v, GAP_BREAKS[1]], GAP_COLORS[1],
    ['<=', v, GAP_BREAKS[2]], GAP_COLORS[2],
    ['<=', v, GAP_BREAKS[3]], GAP_COLORS[3],
    GAP_COLORS[4],
  ];
}

function gridFillExpression() {
  const net = $('network').value, ind = currentIndicator();
  if ($('threshold').value === 'dmgap') return gapExpression(ind, gapBand());
  if ($('threshold').value === 'avg') {
    const col = avgCol(net, ind);
    const ramp = [...BATLOW].reverse();
    const stops = [0, 1000, 2000, 3000, 4000, 5000];
    const expr = ['interpolate', ['linear'], ['coalesce', ['get', col], -9999], -9999, 'rgba(0,0,0,0)'];
    stops.forEach((s, i) => expr.push(s, ramp[i]));
    return expr;
  }
  return isoExpression(net, ind);
}

function renderLegends() {
  const mode = $('threshold').value;
  const isAvg = mode === 'avg';
  const isGap = mode === 'dmgap';

  // ---- LTS ----
  const ltsValues = [1, 2, 3, 4];
  $('ltsLegend').innerHTML = ltsValues.map(k => `
    <div
      class="leg-item ${isolated && isolated.kind === 'lts' && isolated.value === k ? 'selected' : ''}"
      data-kind="lts"
      data-value="${k}"
      onclick="toggleIsolate('lts', ${k})"
    >
      <span class="patch" style="background:${LTS_COLOURS[k]}"></span>
      <span>${k}</span>
    </div>
  `).join('');

  // ---- Access / Dist. ----
  const accTitle = $('accLegendTitle');
  accTitle.textContent = isGap
    ? 'Access depending on dismounting (% of sample points)'
    : 'Access within distance (m)';
  accTitle.title = isGap
    ? 'Share of the cell’s sample points that reach the destination within the selected threshold only when the rider may get off and walk the bike'
    : '50% of population access to destination by distance band (m) using selected network';
  if (isGap) {
    $('accLegend').innerHTML = GAP_COLORS.map((c, i) => `
      <div class="leg-item static">
        <span class="patch" style="background:${c}"></span>
        <span class="dist-label">${GAP_LABELS[i]}</span>
      </div>
    `).join('');
  } else if (isAvg) {
    // no interactive isolation in avg mode, so mark as static
    const ramp   = [...BATLOW].reverse();
    const distLabels   = ['0', '1000', '2000', '3000', '4000', '5000'];
    const timeLabels   = ['< 3 min', '~5 min', '~10 min', '~15 min', '~20 min', '~25 min', ''];

    $('accLegend').innerHTML = ramp.map((c, i) => `
      <div class="leg-item static">
        <span class="patch" style="background:${c}"></span>
        <span class="dist-label">${distLabels[i]}</span>
        <span class="time-label">${timeLabels[i]}</span>
      </div>
    `).join('');
  } else if (!isAvg) {
    const swatchColors = [...ISO_COLORS, ISO_NO_ACCESS];
    const distLabels   = ['500 m', '1000 m', '2000 m', '5000 m', 'None'];
    const timeLabels   = ['~3 min', '~5 min', '~10 min', '~25 min', ''];

    $('accLegend').innerHTML = swatchColors.map((c, i) => `
      <div
        class="leg-item ${isolated && isolated.kind === 'iso' && isolated.value === i ? 'selected' : ''}"
        data-kind="iso"
        data-value="${i}"
        onclick="toggleIsolate('iso', ${i})"
      >
        <span class="patch" style="background:${c}"></span>
        <span class="dist-label">${distLabels[i]}</span>
        <span class="time-label">${timeLabels[i]}</span>
      </div>
    `).join('');
    } else {
    const swatchColors = [...ISO_COLORS, ISO_NO_ACCESS];
    const labels = ['500', '1000', '2000', '5000', 'None'];

    $('accLegend').innerHTML = swatchColors.map((c, i) => `
      <div
        class="leg-item ${isolated && isolated.kind === 'iso' && isolated.value === i ? 'selected' : ''}"
        data-kind="iso"
        data-value="${i}"
        onclick="toggleIsolate('iso', ${i})"
      >
        <span class="patch" style="background:${c}"></span>
        <span>${labels[i]}</span>
      </div>
    `).join('');
  }
}

function toggleIsolate(kind, value) {
  isolated = (isolated && isolated.kind === kind && isolated.value === value)
    ? null : { kind, value };
  renderLegends();
  applyIsolation();
}

// Recompute paint properties for lts / grid / destination-overlay layers given
// the current `isolated` legend selection: the chosen category keeps its
// normal colour/opacity, everything else (the other categories in the same
// legend, and the *other* layer type) is recoloured flat grey at low opacity.
function applyIsolation() {
  if (!map) return;
  // isolation applies to the isochrone bands only; the average-distance and
  // dismount-dependence maps are continuous/derived
  const isAvg = $('threshold').value !== 'iso';

  if (map.getLayer('lts')) {
    if (isolated && isolated.kind === 'lts') {
      map.setPaintProperty('lts', 'line-color',
        ['match', ['get', 'lvl_traf_stress'], isolated.value, LTS_COLOURS[isolated.value], DIM_COLOR]);
      map.setPaintProperty('lts', 'line-opacity',
        ['match', ['get', 'lvl_traf_stress'], isolated.value, 0.95, 0.2]);
    } else {
      map.setPaintProperty('lts', 'line-color', ['match', ['get', 'lvl_traf_stress'],
        1, LTS_COLOURS[1], 2, LTS_COLOURS[2], 3, LTS_COLOURS[3], 4, LTS_COLOURS[4], '#888']);
      map.setPaintProperty('lts', 'line-opacity', isolated ? 0.2 : 0.85);
    }
  }

  if (map.getLayer('grid')) {
    if (!isAvg && isolated && isolated.kind === 'iso') {
      const net = $('network').value, ind = currentIndicator();
      const c = ISO_DISTANCES.map(d => pctCol(net, ind, d));
      const matchExpr = isolated.value < 4
        ? ['>=', ['coalesce', ['get', c[isolated.value]], -1], 50]
        : ['all', ...c.map(col => ['<', ['coalesce', ['get', col], -1], 50])];
      const selColor = isolated.value < 4 ? ISO_COLORS[isolated.value] : ISO_NO_ACCESS;
      map.setPaintProperty('grid', 'fill-color', ['case', matchExpr, selColor, DIM_COLOR]);
      map.setPaintProperty('grid', 'fill-opacity', ['case', matchExpr, 0.8, 0.15]);
    } else {
      map.setPaintProperty('grid', 'fill-color', gridFillExpression());
      map.setPaintProperty('grid', 'fill-opacity', isolated ? 0.15 : 0.65);
    }
  }

  for (const l of Object.keys(OVERLAY_COLORS)) {
    if (!map.getLayer(l)) continue;
    map.setPaintProperty(l, 'circle-color', isolated ? DIM_COLOR : OVERLAY_COLORS[l]);
    map.setPaintProperty(l, 'circle-opacity', isolated ? 0.25 : 1);
  }
}

function updateIndicator() {
  isolated = null;
  refreshAvailability();
  const ok = autofix();
  refreshAvailability();
  $('notice').style.display = ok ? 'none' : 'block';
  $('notice').textContent = ok ? '' : 'This indicator is not available for this city.';
  $('showing').innerHTML = showingText();
  renderLegends();
  renderHisto();

}

const OVERLAY_LAYERS = ['dest_pts', 'ptfreq_pts', 'pos_any_pts', 'pos_large_pts',
                        'ac_local_pts', 'ac_complete_pts'];
function updateOverlays() {
  if (!map || !map.getLayer('dest_pts')) return;
  const on = $('destChk').checked;
  const spec = DEST_OVERLAYS[currentIndicator()] || {};
  const vis = {
    dest_pts: !!spec.dest, ptfreq_pts: !!spec.ptfreq,
    pos_any_pts: !!spec.pos_any, pos_large_pts: !!spec.pos_large,
    ac_local_pts: !!spec.ac_local, ac_complete_pts: !!spec.ac_complete,

  for (const l of OVERLAY_LAYERS) {

    map.setFilter('dest_pts', ['match', ['get', 'dest_name'], spec.dest, true, false]);
}

function fmtDist(v) { return (v === null || v === undefined) ? '–' : `${Math.round(v).toLocaleString()} m`; }

function gridPopupHTML(p) {
  const net = $('network').value;
  const sel = currentIndicator();
  if ($('threshold').value === 'dmgap') return gapPopupHTML(p, sel);
  const bandRows = IND_ORDER.map(ind => {
    const c = ISO_DISTANCES.map(d => pctCol(net, ind, d));
    if (!c.some(col => cols.has(col))) return '';
    let band = 4;
    for (let i = 0; i < 4; i++) {
      const v = p[c[i]];
      if (v !== undefined && v !== null && v >= 50) { band = i; break; }
    }
    const color = band < 4 ? ISO_COLORS[band] : ISO_NO_ACCESS;
    const label = band < 4 ? `Within ${ISO_DISTANCES[band].replace('m', ' m')}` : 'No access within 5000 m';
    return `<tr class="${ind === sel ? 'sel' : ''}"><td><span class="swatch" style="background:${color}"></span>${IND_LABELS[ind]}</td>` +
           `<td class="v">${label}</td></tr>`;
  }).join('');
  const avgRows = IND_ORDER.map(ind => {
    const c = avgCol(net, ind);
    if (!cols.has(c)) return '';
    return `<tr class="${ind === sel ? 'sel' : ''}"><td>${IND_LABELS[ind]}</td><td class="v">${fmtDist(p[c])}</td></tr>`;
  }).join('');
  let html = `<div class="popup"><h4>${IND_LABELS[sel]}</h4>` +
             `<p class="sub">${NETWORKS[net].label} routing</p>`;
  if (bandRows) html += `<h5>Access band (closest distance with ≥50% of sample points reached)…</h5><table>${bandRows}</table>`;
  if (avgRows) html += `<h5>Average distance to nearest…</h5><table>${avgRows}</table>`;
  return html + '</div>';
}

// dismount-dependence popup: the same cell read three ways — access with
// dismounting, access ridden throughout, and the gap between them
function gapPopupHTML(p, sel) {
  const band = gapBand();
  const pct = v => (v === null || v === undefined) ? '–' : `${Math.round(v)}%`;
  const rows = IND_ORDER.map(ind => {
    const g = p[pctCol(DMGAP, ind, band)];
    if (g === undefined) return '';
    const withD = p[pctCol('safe_', ind, band)];
    const ride = p[pctCol('ride_', ind, band)];
    const extra = p[extraCol(ind)];
    return `<tr class="${ind === sel ? 'sel' : ''}"><td>${IND_LABELS[ind]}</td>` +
           `<td class="v">${pct(withD)}</td><td class="v">${pct(ride)}</td>` +
           `<td class="v"><b>${pct(g)}</b></td>` +
           `<td class="v">${extra === null || extra === undefined ? '–' : `+${Math.round(extra).toLocaleString()} m`}</td></tr>`;
  }).join('');
  return `<div class="popup"><h4>${IND_LABELS[sel]}</h4>` +
    `<p class="sub">Sample points reaching the destination within ${band.replace('m', ' m')}</p>` +
    (rows
      ? '<table><tr><td></td><td class="v">with<br>dismount</td>' +
        '<td class="v">ridden<br>only</td><td class="v">depends on<br>dismount</td>' +
        '<td class="v">extra to<br>ride around</td></tr>' + rows + '</table>'
      : '<p class="sub">No dismount contrast available for this cell.</p>') +
    '</div>';
}

// Nearest Street View panorama to a point (Google Maps URLs API, no key needed).
// The same link the written report puts beside each priority link, so a reviewer
// meets the same tool in both places.
function streetViewUrl(lng, lat, heading) {
  return 'https://www.google.com/maps/@?api=1&map_action=pano' +
    `&viewpoint=${lat.toFixed(5)},${lng.toFixed(5)}` +
    (heading == null ? '' : `&heading=${Math.round(heading)}`);
}
// initial bearing in degrees clockwise from north; null if the points coincide
function bearingBetween([lng1, lat1], [lng2, lat2]) {
  if (lng1 === lng2 && lat1 === lat2) return null;
  const r = Math.PI / 180;
  const p1 = lat1 * r, p2 = lat2 * r, dl = (lng2 - lng1) * r;
  const y = Math.sin(dl) * Math.cos(p2);
  const x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
  return (Math.atan2(y, x) / r + 360) % 360;
}
// The segment the click landed on gives a truer heading than the link's overall
// direction: on a curved or L-shaped path the two can point nowhere near each
// other, and the panorama should face along the bit that was clicked.
function segmentBearing(geometry, at) {
  const g = geometry || {};
  const lines = g.type === 'MultiLineString' ? g.coordinates
    : g.type === 'LineString' ? [g.coordinates] : [];
  let best = null, bestD = Infinity;
  for (const line of lines)
    for (let i = 0; i < line.length - 1; i++) {
      const mx = (line[i][0] + line[i + 1][0]) / 2;
      const my = (line[i][1] + line[i + 1][1]) / 2;
      const d = (mx - at.lng) ** 2 + (my - at.lat) ** 2;
      if (d < bestD) { bestD = d; best = [line[i], line[i + 1]]; }
    }
  return best ? bearingBetween(best[0], best[1]) : null;
}

// a link riders must dismount and walk, scored by how much of the population's
// nearest-destination routing leans on it
function dismountPopupHTML(f, at) {
  const p = f.properties;
  const n = v => Math.round(v || 0).toLocaleString();
  const sv = streetViewUrl(at.lng, at.lat, segmentBearing(f.geometry, at));
  return `<div class="popup"><h4>${p.name || 'Unnamed footway'}</h4>` +
    `<p class="sub"><span class="swatch" style="background:${DISMOUNT_COLOR}"></span>` +
    `Dismount required — ${p.highway || 'path'}, ${n(p.length_m)} m</p><table>` +
    `<tr><td>Journeys walking it</td><td class="v">${n(p.dm_pop_served)}</td></tr>` +
    `<tr><td>…that depend on it</td><td class="v"><b>${n(p.dm_pop_dependent)}</b></td></tr>` +
    `<tr><td>Destination types</td><td class="v">${p.dm_specs || 0}</td></tr>` +
    `</table><p class="sub" style="margin-top:6px"><a href="${sv}" target="_blank"` +
    ' rel="noopener" title="Nearest Street View panorama — coverage varies by city">' +
    'Street View</a> — is this really unridable, or a mapping artefact?</p>' +
    '<p class="sub" style="margin-top:6px">Resident–destination journeys whose ' +
    'nearest-destination low-stress route walks this link, and the subset with no ridden ' +
    'low-stress route to that destination type at all. Summed over the destination types ' +
    'in the last row, so a resident heading to two of them counts twice. Scores rank ' +
    'links; they are not additive across links, since one route may walk several.</p></div>';
}

function ltsPopupHTML(p) {
  const lts = p.lvl_traf_stress;
  const row = (k, v) => (v === null || v === undefined || v === '') ? ''
    : `<tr><td>${k}</td><td class="v">${v}</td></tr>`;
  return `<div class="popup"><h4>${p.name || 'Unnamed way'}</h4>` +
    `<p class="sub"><span class="swatch" style="background:${LTS_COLOURS[lts] || '#888'}"></span>` +
    `LTS ${lts} — ${LTS_LABELS[lts] || ''}</p><table>` +
    row('Highway type', p.highway) +
    row('Speed limit', p.maxspeed_kmh ? `${p.maxspeed_kmh} km/h` : null) +
    row('Traffic (assumed ADT)', p.adt ? Math.round(p.adt).toLocaleString() : null) +
    row('Cycling facility', p.bike_facility) +
    row('Dismount required', p.foot_dismount ? 'yes' : null) +
    row('Segment length', p.length_m ? `${p.length_m} m` : null) +
    '</table></div>';
}

// ---- hover tooltips on destination-type point layers ----
const HOVER_LAYERS = ['dest_pts', 'ptfreq_pts', 'pos_any_pts', 'pos_large_pts', 'ac_local_pts', 'ac_complete_pts'];
function hoverHTML(layerId, p) {
  switch (layerId) {
    case 'dest_pts':
      return `<b>${p.dest_name_full || p.dest_name || 'Destination'}</b>`;
    case 'ptfreq_pts': {
      const bits = [p.stop_name, p.mode, p.headway ? `every ${Math.round(p.headway)} min` : null]
        .filter(Boolean).join(' · ');
      return `<b>Public transport (frequent)</b>${bits ? `<br>${bits}` : ''}`;
    }
    case 'pos_any_pts':
    case 'pos_large_pts': {
      const tier = layerId === 'pos_large_pts' ? 'large' : 'any';
      const ha = (p.aos_ha !== null && p.aos_ha !== undefined) ? `<br>${p.aos_ha} ha open space` : '';
      return `<b>Public open space entry (${tier})</b>${ha}`;
    }
    case 'ac_local_pts':
      return '<b>Local activity centre</b><br>lenient-definition destinations of every category within 400 m';
    case 'ac_complete_pts':
      return '<b>Complete activity centre</b><br>strict-definition destinations of every category within 400 m';
    default:
      return '';
  }
}
function wireHover() {
  const tip = $('hoverTip');
  for (const l of HOVER_LAYERS) {
    map.on('mousemove', l, e => {
      if (!e.features.length) return;
      map.getCanvas().style.cursor = 'pointer';
      tip.innerHTML = hoverHTML(l, e.features[0].properties);
      tip.style.left = (e.originalEvent.clientX + 14) + 'px';
      tip.style.top = (e.originalEvent.clientY + 10) + 'px';
      tip.style.display = 'block';
    });
    map.on('mouseleave', l, () => {
      map.getCanvas().style.cursor = '';
      tip.style.display = 'none';
    });
  }
}

function infoHTML() {
  const ind = currentIndicator(), net = $('network').value, mode = $('threshold').value;
  const what = mode === 'dmgap'
    ? `the <b>share of the cell’s sample points whose access depends on dismounting</b>: they reach such a destination within ${gapBand().replace('m', ' m')} on the low-stress (LTS 1–2) network when the rider may get off and walk the bike, but not when the same route must be ridden throughout`
    : mode === 'avg'
    ? `the <b>average network distance</b> (metres) from the cell’s sample points to the nearest such destination, averaged only over sample points that can reach one at all — so sparse areas can show few reachable points <i>and</i> long distances`
    : `an <b>isochrone-style distance band</b>: the closest of 500 m, 1000 m, 2000 m or 5000 m at which at least half the cell’s sample points can reach such a destination (neutral grey = no band within 5000 m has majority access)`;
  const gapSection = mode !== 'dmgap' ? '' : `
    <h3>Why this comparison</h3>
    <p>A low-stress route that only exists because part of it is walked along a footpath —
    beside an arterial, or across a hostile intersection — is not a route that can be
    ridden. Contrasting the two shows where the low-stress network is genuinely
    connected and where it is being held together by pushing the bike, which is a
    signal for where cycling infrastructure would do the most work. Cells shaded pale
    grey have no such dependence; the darker the purple, the more of the cell’s
    access rests on dismounting.</p>
    <p>Click a cell for the underlying numbers: access with dismounting, access ridden
    throughout, the gap between them, and the extra distance needed to ride around the
    walked links where that is possible at all. The <b>Dismount priority links</b> layer
    (where available) names the individual links carrying that load.</p>`;
  const isoSection = mode !== 'iso' ? '' : `
    <h3>Reading the colour bands</h3>
    <p>Each grid cell is coloured by the <b>closest</b> distance at which the majority
    (≥ 50%) of its sample points have access — pale pink/yellow = very close (500 m),
    shading through to dark blue = only reachable at 5000 m, grey = not reachable within
    any configured distance. This mirrors the isochrone maps in the full validation
    report. Click a swatch in the legend to isolate that band on the map.</p>`;
  return `<h2>How to read this indicator</h2>
    <p><b>${IND_LABELS[ind]}</b> — for each 100 m population grid cell, the map shows ${what}.</p>
    <h3>Destination</h3><p>Access is counted to ${IND_DESCS[ind]}.</p>
    ${isoSection}${gapSection}
    <h3>Routing (${mode === 'dmgap' ? 'LTS 1–2, with vs without dismount' : NETWORKS[net].label})</h3>
    <p>Routes are computed over ${mode === 'dmgap' ? NETWORKS.safe_.desc + ', compared with ' + NETWORKS.ride_.desc : NETWORKS[net].desc}. Level of Traffic Stress (LTS) grades each
    street segment from 1 (lowest stress, suitable for all riders) to 4 (high stress), based on
    cycling infrastructure, street class, speed limit and assumed traffic volumes derived from
    OpenStreetMap.</p>
    <h3>Walking the bike (dismount links)</h3>
    <p>Footways, paths and pedestrian areas where riding is not permitted are still part of
    the routable network: a rider may dismount and walk the bike along them, and they are
    graded LTS 1 since they are traffic-free. Each metre walked counts as <b>3 m</b> of the
    distance threshold, reflecting walking pace (~5 km/h) against cycling (~15 km/h).
    Stairs and indoor corridors are excluded as impractical with a bike. On the map, such
    segments show “Dismount required: yes” when clicked.</p>
    <p>Because that allowance can carry a lot of weight, the same low-stress measure is
    also computed <b>without</b> it (Network: “LTS 1–2, no dismount”), and the
    <b>Dismount dependence</b> indicator maps the difference between the two.</p>
    <h3>Strict vs lenient</h3>
    <p>Each destination category has a <b>strict</b> definition (fresh food markets only;
    frequent public transport; large open spaces; “complete” activity centres) and a
    <b>lenient</b> one (pooled fresh food sources; any stop; any open space; “local”
    activity centres). Comparing the two brackets the plausible range for access.</p>
    <h3>The validation activity</h3>
    <p>The <b>Validation activity</b> button opens the structured feedback form, in three parts.
    <b>Part A</b> walks a stratified sample of points — five in each geographic quadrant of the
    study region, drawn with probability proportional to grid-cell population — and shows the
    actual routes the indicators used to reach the nearest destination of each category. Each
    point is judged once under <b>each of the four network scenarios</b>, so the four ways of
    accounting for access are compared on identical points. <b>Part B</b> asks for one overall
    judgement per scenario, and <b>Part C</b> rates the wider method against your city's context.</p>
    <p>The four scenarios assume, in turn, that:</p>
    <ul style="margin:2px 0 0 16px;padding:0">
      ${Object.keys(MEASURE_UI).map(k =>
        `<li><b>${MEASURE_UI[k].full}</b> — ${MEASURE_UI[k].assume}.</li>`).join('')}
    </ul>
    <p>Answers are held in this browser as you go, and downloaded at the end as a single
    file to email to the research team.</p>
    <p style="text-align:right"><button class="small" onclick="infoModal.style.display='none'">Close</button></p>`;
}

  slug = s;

  const b = manifest.bbox;
  hasReport = (await fetch(`./reports/${s}.html`, { method: 'HEAD' }).catch(() => ({ ok: false }))).ok;
  $('reportBtn').style.display = hasReport ? 'inline-block' : 'none';
  renderRound1(s);
  exitAssessment();
  // switching city calls setStyle, which drops the measure source and layers
  clearMeasure();
  await loadRoutes(s);

  // the dismount priority layer only exists for cities analysed with it
  const hasDismount = !!(manifest.layers || {}).dismount;
  $('dismountChkRow').style.display = hasDismount ? '' : 'none';
  if (!hasDismount) $('dismountChk').checked = false;

  const circle = (colour, r) => ({
    'circle-radius': ['interpolate', ['linear'], ['zoom'], 10, r * 0.6, 14, r],
    'circle-color': colour, 'circle-stroke-color': '#fff', 'circle-stroke-width': 1,
  });
  const style = {
    version: 8,
    sources: {

        layout: { visibility: 'none' }, paint: circle(OVERLAY_COLORS.ac_local_pts, 3.5) },
      { id: 'ac_complete_pts', type: 'circle', source: 'city', 'source-layer': 'ac_complete',
        layout: { visibility: 'none' }, paint: circle(OVERLAY_COLORS.ac_complete_pts, 3.5) },

    ],

  const bb = [[b[0], b[1]], [b[2], b[3]]];
  if (map) {
    map.setMinZoom(0);
    map.setStyle(style);
  } else {
    map = new maplibregl.Map({ container: 'map', style, bounds: bb });
    map.addControl(new maplibregl.NavigationControl());
    map.on('moveend', updateHash);
    map.on('click', e => {
      // while the ruler is active, clicks drop vertices instead of opening popups
      if (measuring) { addMeasurePoint(e.lngLat); return; }
      const layers = ['lts', 'grid'];
      if (map.getLayer('dismount')
          && map.getLayoutProperty('dismount', 'visibility') === 'visible')
        layers.unshift('dismount');
      const f = map.queryRenderedFeatures(e.point, { layers })[0];
      if (!f) return;
      const html = f.layer.id === 'dismount' ? dismountPopupHTML(f, e.lngLat)
        : f.layer.id === 'lts' ? ltsPopupHTML(f.properties)
        : gridPopupHTML(f.properties);

    });

  // detail and the apparent scale of the grid are comparable between cities
  // rather than a function of how large the study region happens to be.
  const fit = map.cameraForBounds(bb, { padding: 20 })
    || { center: map.getCenter(), zoom: map.getZoom() };
  // don't allow zooming out beyond the whole-city view: low-zoom tiles thin
  // out dense layers to stay within size budgets, which reads as gaps.
  // Floor of 9 because grid tiles below z9 are thinned even for large regions;
  // capped at the default so a compact region isn't clamped back out of it.
  map.setMinZoom(Math.max(9, Math.min(DEFAULT_ZOOM, fit.zoom - 0.1)));
  if (!initialCameraPending) map.jumpTo({ center: fit.center, zoom: DEFAULT_ZOOM });
  if (initialCameraPending) {
    initialCameraPending = false;
    const [z, lat, lng] = (initialState.get('m') || '').split('/').map(Number);
    if ([z, lat, lng].every(Number.isFinite)) map.jumpTo({ center: [lng, lat], zoom: z });
  }

  map.isStyleLoaded() ? apply() : map.once('styledata', apply);
}

const needsComment = rec => ((rec || {}).issues || []).includes('other');

// is the part that can be acted on, so an unexplained No counts as unfinished.
const answered = a => !!a && !!a.ok && (a.ok !== 'no' || reasonsGiven(a));

function issuesHTML(a) {

  const dests = checkedValues('dest');

// Round 2 response record. The key is deliberately new: `cyclingValidationResponses:`
// holds the earlier per-point 1–5 shape, which cannot be mapped onto per-network
// yes/no answers. That data is left in place untouched rather than migrated.
const RESP_PREFIX = 'cyclingValidationV2:';
const RATER_KEY = 'cyclingValidationRater';
function respKey(s) { return RESP_PREFIX + s; }
function loadResponses(s) {
  resp = blankResp();
  try {
    const raw = JSON.parse(localStorage.getItem(respKey(s)));
    if (raw && typeof raw === 'object') resp = Object.assign(resp, raw);
  } catch {}
  resp.slug = s;
  // the rater is the same person across cities, so it lives outside the city record
  try { resp.rater = localStorage.getItem(RATER_KEY) || resp.rater || ''; } catch {}
  // seed each checklist group's ranking with the order the items are declared in
  for (const g of CHECKLIST) {
    const cur = resp.checklist[g.key] || { order: [], items: {} };
    const known = g.items.map(i => i.key);
    cur.items = cur.items || {};
    cur.order = (cur.order || []).filter(k => known.includes(k));
    for (const k of known) if (!cur.order.includes(k)) cur.order.push(k);
    resp.checklist[g.key] = cur;
  }
}
function saveResponses() {
  resp.updated = new Date().toISOString();
  try { localStorage.setItem(respKey(resp.slug || slug), JSON.stringify(resp)); } catch {}
  try { if (resp.rater) localStorage.setItem(RATER_KEY, resp.rater); } catch {}
  refreshActivityStatus(resp.slug || slug);
}

// ---- progress counters, shared by the stage navigator and the start screen ----
// Each takes an optional record so the status beside the button can be read off
// a stored city without disturbing the one being worked on.
function nPoints() { return routeData ? routeData.points.length : 0; }
function nMeasures() { return routeData ? routeData.measures.length : 0; }
function pointAnswers(id, r) {
  return Object.values(((r || resp).points || {})[id] || {}).filter(answered).length;
}
function countA(r) {
  return (routeData ? routeData.points : []).reduce((n, p) => n + pointAnswers(p.id, r), 0);
}
function countB(r) {
  return Object.values((r || resp).overall || {}).filter(answeredOverall).length;
}
// Part C progress counts the rateable items only: the "Other" rows are free text,
// and Result formats is ranked rather than rated, so neither can be "unanswered".
function rateableC() {
  return CHECKLIST.filter(g => g.rate)
    .flatMap(g => g.items.filter(i => !i.other).map(i => [g.key, i.key]));
}
function countC(r) {
  return rateableC().filter(([gk, ik]) => {
    const v = (((r || resp).checklist || {})[gk] || {}).items || {};
    const it = v[ik] || {};
    return it.v !== undefined && it.v !== '' && it.a !== undefined && it.a !== '';
  }).length;
}
function totalC() { return rateableC().length; }
function activityComplete(r) {
  return !!routeData && countA(r) === nPoints() * nMeasures()
    && countB(r) === nMeasures() && countC(r) === totalC();
}
// What is still missing, in the same wording as the progress line.
