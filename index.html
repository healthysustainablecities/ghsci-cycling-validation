  return `Parts A, B and C must all be complete before you can download: ` +
    `A ${countA(r)}/${nPoints() * nMeasures()}, B ${countB(r)}/${nMeasures()}, ` +
    `C ${countC(r)}/${totalC()}.`;
}
// A one-word state beside the Validation activity button, so someone returning
// to the page can see where they left off without opening the activity.
function refreshActivityStatus(s) {
  const el = $('assessStatus');
  if (!el) return;
  if (!routeData) { el.textContent = ''; el.className = ''; return; }
  let stored = null;
  try { stored = JSON.parse(localStorage.getItem(respKey(s || slug))); } catch {}
  const r = Object.assign(blankResp(), stored || {});
  const started = countA(r) + countB(r) + countC(r) > 0;
  const done = activityComplete(r);
  el.textContent = !started ? 'not yet started'
    : done ? 'completed! \u{1F389}\u{1F64F}' : 'incomplete';
  el.className = done ? 'done' : started ? 'part' : '';
}

async function loadRoutes(s) {
  routeData = null;
  try {
    const res = await fetch(`./routes/${s}_routes.json`);
    if (res.ok) routeData = await res.json();
  } catch {}
  $('assessBtn').style.display = routeData ? 'inline-block' : 'none';
  refreshActivityStatus(s);
}

function routeFor(pointId, measure, cat) {
  return (routeData.routes || []).find(
    x => x.p === pointId && x.meas === measure && x.cat === cat);
}

// How a route's distance budget is spent.  Verified against the exported costs:
// cost = ridden_low + 1.25*ridden_high + 3*walked + intersection crossings,
// where the crossing term appears only on the stress-penalty network.
const DANGER_W = 1.25, DISMOUNT_W = 3;
function costBreakdown(rt) {
  let low = 0, high = 0, walked = 0;
  for (const s of rt.seg || []) {
    if (s.d) walked += s.m;
    else if (s.lts === 3 || s.lts === 4) high += s.m;
    else low += s.m;
  }
  const predicted = low + DANGER_W * high + DISMOUNT_W * walked;
  // travelled is derived from the same segment sum as the parts, so the
  // displayed total always equals the displayed components
  return { low, high, walked, travelled: low + high + walked,
           imped: Math.max(0, rt.cm - predicted) };
}
function travelledM(rt) {
  return (rt.seg && rt.seg.length) ? costBreakdown(rt).travelled : rt.m;
}

// One-line account of how the counted distance is made up, e.g.
// "757 m ridden + (118 m walk × 3 dismount penalty)".  The connection from the
// sample point to the network (and to the destination door) is counted as ridden.
// The ridden figure is derived from the total so the arithmetic shown always
// reconciles with the distance in the table, whatever the rounding.
function breakdownText(pt, c) {
  const rt = routeFor(pt.id, assessMeasure, c.key);
  if (!rt || !rt.ok) return 'no route within the limit';
  // no network path only means the sample point and the destination share a node;
  // the connection legs at either end can still be most of a few hundred metres
  if ((!rt.seg || !rt.seg.length) && Math.round(rt.net) <= 0)
    return 'destination is at this location';
  const b = costBreakdown(rt);
  const total = Math.round(rt.net);
  // derive from the *rounded* components so the equation shown adds up exactly
  // to the distance in the table
  const walk = Math.round(b.walked), high = Math.round(b.high);
  const wCross = b.imped >= 1 ? Math.round(b.imped) : 0;
  const ridden = total - DISMOUNT_W * walk - Math.round(DANGER_W * high) - wCross;
  const parts = [`${ridden.toLocaleString()} m ridden`];
  if (high) parts.push(`(${high.toLocaleString()} m higher-stress ` +
    `× ${DANGER_W} stress penalty)`);
  if (walk) parts.push(`(${walk.toLocaleString()} m walk ` +
    `× ${DISMOUNT_W} dismount penalty)`);
  if (wCross) parts.push(`(${wCross.toLocaleString()} m crossings)`);
  return parts.join(' + ');
}

// What the dismount allowance is worth here: the same low-stress route ridden
// throughout, for comparison with the one that may walk the bike.  Shown only while
// one of that pair is selected, and only when the two actually differ.
function dismountCompareText(pt, c) {
  if (assessMeasure !== 'low_stress' && assessMeasure !== 'low_stress_ride') return '';
  const walk = routeFor(pt.id, 'low_stress', c.key);
  const ride = routeFor(pt.id, 'low_stress_ride', c.key);
  if (!walk || !ride || !walk.ok) return '';
  if (!ride.ok) {
    const limit = (routeData.max_band_m || 5000).toLocaleString();
    return `without dismounting: no low-stress route within ${limit} m`;
  }
  const diff = Math.round(ride.net) - Math.round(walk.net);
  return diff > 0 ? `without dismounting: +${diff.toLocaleString()} m` : '';
}

function ensureAssessLayers() {
  if (map.getSource('assess')) return;
  map.addSource('assess', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  const colorExpr = ['match', ['get', 'cat'],
    'fresh_food_market', CAT_COLORS.fresh_food_market,
    'pt_frequent', CAT_COLORS.pt_frequent,
    'public_open_space_large', CAT_COLORS.public_open_space_large, '#888'];
  // highlighter styling: thick and semi-transparent so the street underneath
  // (and its LTS colour) stays readable through the route
  const w = ['interpolate', ['linear'], ['zoom'], 11, 6, 14, 11, 17, 16];
  map.addLayer({ id: 'assess_ridden', type: 'line', source: 'assess',
    filter: ['all', ['==', ['geometry-type'], 'LineString'],
             ['==', ['get', 'conn'], 0], ['==', ['get', 'd'], 0]],
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': colorExpr, 'line-width': w, 'line-opacity': 0.42 } });
  map.addLayer({ id: 'assess_dismount', type: 'line', source: 'assess',
    filter: ['all', ['==', ['geometry-type'], 'LineString'],
             ['==', ['get', 'conn'], 0], ['==', ['get', 'd'], 1]],
    layout: { 'line-cap': 'butt', 'line-join': 'round' },
    paint: { 'line-color': colorExpr, 'line-width': w, 'line-opacity': 0.42,
             'line-dasharray': [1, 0.9] } });
  // The connection legs -- sample point to its terminal node, and destination node
  // to the destination.  Deliberately unlike the route itself: these are counted at
  // face value, without stress weighting, and may run along a street the measure
  // otherwise excludes, so they must not read as part of the assessed route.
  map.addLayer({ id: 'assess_conn', type: 'line', source: 'assess',
    filter: ['==', ['get', 'conn'], 1],
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': colorExpr, 'line-opacity': 0.75,
             'line-width': ['interpolate', ['linear'], ['zoom'], 11, 2.5, 14, 4, 17, 6],
             'line-dasharray': [0.1, 1.8] } });
  // the destination's own offset from the network: not counted at all
  map.addLayer({ id: 'assess_snap', type: 'line', source: 'assess',
    filter: ['==', ['get', 'conn'], 2],
    paint: { 'line-color': colorExpr, 'line-opacity': 0.5, 'line-width': 1.5,
             'line-dasharray': [2, 2] } });
  map.addLayer({ id: 'assess_dest', type: 'circle', source: 'assess',
    filter: ['==', ['get', 'kind'], 'dest'],
    paint: { 'circle-radius': 6, 'circle-color': colorExpr,
             'circle-stroke-color': '#fff', 'circle-stroke-width': 2 } });
  map.addLayer({ id: 'assess_origin', type: 'circle', source: 'assess',
    filter: ['==', ['get', 'kind'], 'origin'],
    paint: { 'circle-radius': 8, 'circle-color': '#ffd400',
             'circle-stroke-color': '#000', 'circle-stroke-width': 2 } });
  wireAssessHover();
}

// hover detail for the sample point, the destinations and each route segment
function wireAssessHover() {
  const tip = $('hoverTip');
  const catLabel = k => {
    const c = (routeData.categories || []).find(x => x.key === k);
    return c ? c.label : k;
  };
  const html = p => {
    if (p.kind === 'origin')
      return `<b>Sample point ${routeData.points[assessIdx].id}</b>` +
             `<br>the location being assessed`;
    if (p.kind === 'dest')
      return `<b>Nearest ${catLabel(p.cat).toLowerCase()}</b>` +
             `<br>destination this route reaches` +
             (p.snap > 0 ? `<br><span style="opacity:.75">${Math.round(p.snap)} m ` +
              `off the network (not counted)</span>` : '');
    if (p.conn === 1)
      return `<b>Connection to the network</b><br>` +
             `${Math.round(p.m).toLocaleString()} m along the street ` +
             (p.side === 'o' ? ' counted from the sample point to the nearest intersection'
                             : ' counted from the network to the destination') +
             `<br><span style="opacity:.75">route to ${catLabel(p.cat).toLowerCase()}` +
             `</span>`;
    if (p.conn === 2)
      return `<b>Destination sits off the network</b><br>` +
             `${Math.round(p.m).toLocaleString()} m — not counted in the distance`;
    const bits = [`${Math.round(p.m).toLocaleString()} m`];
    if (p.lts) bits.push(`LTS ${p.lts}`);
    if (p.hw) bits.push(p.hw);
    return `<b>${p.d ? 'Walked (bike dismounted)' : 'Ridden'}` +
           `${p.n ? ' — ' + p.n : ''}</b><br>` + bits.join(' · ') +
           (p.d ? '<br>walked distance counts ×3 toward the limit' : '') +
           `<br><span style="opacity:.75">route to ${catLabel(p.cat).toLowerCase()}</span>`;
  };
  for (const l of ['assess_origin', 'assess_dest', 'assess_ridden',
                   'assess_dismount', 'assess_conn', 'assess_snap']) {
    map.on('mousemove', l, e => {
      if (!e.features.length) return;
      map.getCanvas().style.cursor = 'pointer';
      tip.innerHTML = html(e.features[0].properties);
      tip.style.left = (e.originalEvent.clientX + 14) + 'px';
      tip.style.top = (e.originalEvent.clientY + 10) + 'px';
      tip.style.display = 'block';
    });
    map.on('mouseleave', l, () => {
      map.getCanvas().style.cursor = '';
      tip.style.display = 'none';
    });
  }
}

// The end of the final segment that the route actually arrives at.  Exports made
// before segments were emitted in travel order leave the geometry in the edge's own
// digitising direction, so the arrival end is whichever end is *not* shared with the
// preceding segment.
function arrivalEnd(segs) {
  const b = segs[segs.length - 1].c;
  if (segs.length < 2) return b[b.length - 1];
  const a = segs[segs.length - 2].c, ends = [a[0], a[a.length - 1]];
  const near = p => Math.min(...ends.map(
    e => (e[0] - p[0]) ** 2 + (e[1] - p[1]) ** 2));
  return near(b[0]) < near(b[b.length - 1]) ? b[b.length - 1] : b[0];
}

function drawStep() {
  const pt = routeData.points[assessIdx];
  const feats = [{ type: 'Feature', properties: { kind: 'origin' },
                   geometry: { type: 'Point', coordinates: [pt.lon, pt.lat] } }];
  const bounds = new maplibregl.LngLatBounds([pt.lon, pt.lat], [pt.lon, pt.lat]);
  const line = (coords, props) => {
    if (!coords || coords.length < 2) return;
    feats.push({ type: 'Feature', properties: props,
                 geometry: { type: 'LineString', coordinates: coords } });
    for (const co of coords) bounds.extend(co);
  };
  for (const c of routeData.categories) {
    const rt = routeFor(pt.id, assessMeasure, c.key);
    if (!rt || !rt.ok) continue;
    for (const s of (rt.seg || [])) {
      line(s.c, { cat: c.key, conn: 0, d: s.d, lts: s.lts, m: s.m,
                  hw: s.hw || '', n: s.n || '' });
    }
    // the leg from the sample point out to the node the route starts from: real
    // distance the indicator charged, and without it the route appears to begin
    // somewhere else entirely
    const oc = (pt.conn || {})[String(rt.t)];
    if (oc) line(oc, { cat: c.key, conn: 1, side: 'o', m: rt.to });
    // no leg where the point sits on the node itself (offset 0, nothing to draw)
    else if (rt.seg && rt.seg.length && (rt.to === undefined || rt.to > 0)) {
      const s0 = rt.seg[0].c, d = p => (p[0] - pt.lon) ** 2 + (p[1] - pt.lat) ** 2;
      const near = d(s0[0]) <= d(s0[s0.length - 1]) ? s0[0] : s0[s0.length - 1];
      line([[pt.lon, pt.lat], near], { cat: c.key, conn: 1, side: 'o', m: rt.to });
    }
    // ... and the matching leg at the far end, on to the destination itself
    let destAt = null;
    if (rt.dest) {
      line(rt.dest.c, { cat: c.key, conn: 1, side: 'd', m: rt.dest.off });
      if (rt.dest.snap > 0 && rt.dest.mp)
        line([rt.dest.mp, [rt.dest.lon, rt.dest.lat]],
             { cat: c.key, conn: 2, m: rt.dest.snap });
      destAt = [rt.dest.lon, rt.dest.lat];
    } else if (rt.seg && rt.seg.length) {
      destAt = arrivalEnd(rt.seg);
    }
    if (destAt) {
      feats.push({ type: 'Feature',
        properties: { kind: 'dest', cat: c.key,
                      off: rt.dest ? rt.dest.off : null,
                      snap: rt.dest ? rt.dest.snap : null },
        geometry: { type: 'Point', coordinates: destAt } });
      bounds.extend(destAt);
    }
  }
  map.getSource('assess').setData({ type: 'FeatureCollection', features: feats });
  // annotate the origin and each destination directly on the map (HTML markers,
  // so no glyph server is needed for a self-contained site)
  assessLabels.forEach(mk => mk.remove());
  assessLabels = feats.filter(f => f.properties.kind).map(f => {
    const el = document.createElement('div');
    el.className = 'maplbl';
    if (f.properties.kind === 'origin') {
      el.textContent = 'Origin';
      el.style.borderColor = '#000';
    } else {
      const c = routeData.categories.find(x => x.key === f.properties.cat);
      el.textContent = c ? c.label : f.properties.cat;
      el.style.borderColor = CAT_COLORS[f.properties.cat] || '#888';
    }
    return new maplibregl.Marker({ element: el, anchor: 'bottom', offset: [0, -10] })
      .setLngLat(f.geometry.coordinates).addTo(map);
  });
  // keep the routes clear of whichever panes are currently open
  const paneRight = [...document.querySelectorAll('#panel, #assess')]
    .filter(e => getComputedStyle(e).display !== 'none')
    .reduce((mx, e) => Math.max(mx, e.getBoundingClientRect().right), 0);
  map.fitBounds(bounds, {
    padding: { top: 60, bottom: 60, left: Math.round(paneRight) + 30, right: 60 },
    maxZoom: 16, duration: 400,
  });
}

const attr = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
// for the comment boxes, which are now banked as they are typed rather than on
// navigation: no need to rewrite the whole record on every keystroke
const debounce = (fn, ms) => {
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
};

// The scenario buttons, shared by Parts A and B so the control is learnt once.
function netBtnsHTML(current) {
  return '<div class="net-btns" id="measCtl">' + routeData.measures.map(m =>
    `<button data-meas="${m.key}" title="${attr(measTip(m.key))}"` +
    `${m.key === current ? ' class="on"' : ''}>` +
    `${(MEASURE_UI[m.key] || {}).btn || m.short}</button>`).join('') + '</div>';
}

// Arriving at a point, or at Part B, starts on the leftmost scenario still
// unanswered — so a rater always works left to right and a fresh point always
// opens on LTS 1, rather than inheriting whatever was last looked at.
function resetMeasure(done) {
  if (!routeData) return;
  assessMeasure = (routeData.measures.find(m => !done.has(m.key))
    || routeData.measures[0]).key;
  syncDashboardNetwork();
}

// Which scenarios carry an answer — for a point (Part A), and for the city (Part B).
const donePoint = id => new Set(routeData.measures.map(m => m.key)
  .filter(k => answered((resp.points[id] || {})[k])));
const doneOverall = () => new Set(routeData.measures.map(m => m.key)
  .filter(k => answeredOverall(resp.overall[k])));

// Progress feedback applied by class, not by re-rendering, so a part-typed
// comment is never lost: shade what is answered, ring what to do next. The ring
// only appears once the scenario on screen has been answered — until then the
// thing to do is the question already in front of the rater — and lands on the
// forward button when every scenario has an answer.
function markProgress(done, current) {
  const btns = [...document.querySelectorAll('#measCtl button[data-meas]')];
  for (const b of btns) {
    b.classList.toggle('done', done.has(b.dataset.meas));
    b.classList.remove('next');
  }
  const fwd = $('nextBtn');
  if (fwd) fwd.classList.remove('next');
  if (!done.has(current)) return;
  const nextUp = btns.find(b => !done.has(b.dataset.meas));
  if (nextUp) nextUp.classList.add('next');
  else if (fwd) fwd.classList.add('next');
}

function stepHTML() {
  const pt = routeData.points[assessIdx];
  const a = (resp.points[pt.id] || {})[assessMeasure] || {};
  const limit = (routeData.max_band_m || 5000).toLocaleString();
  const rows = routeData.categories.map(c => {
    const cells = routeData.measures.map(m => {
      const rt = routeFor(pt.id, m.key, c.key);
      const sel = m.key === assessMeasure ? ' selcol' : '';
      if (!rt || !rt.ok) return `<td class="dim${sel}">—</td>`;
      // the indicator value: what is actually compared with the distance limits
      return `<td class="${sel ? 'selcol' : 'dim'}">` +
             `${Math.round(rt.net).toLocaleString()}</td>`;
    }).join('');
    const cmp = dismountCompareText(pt, c);
    return `<tr><td class="l"><span class="dot" style="background:${CAT_COLORS[c.key] || '#888'}"></span>` +
           `${c.label}<div class="bd-x">${breakdownText(pt, c)}</div>` +
           (cmp ? `<div class="dm-x">${cmp}</div>` : '') + `</td>${cells}</tr>`;
  }).join('');
  return `
    ${netBtnsHTML(assessMeasure)}
    <table class="rt"><thead><tr><th class="l">Distance (m)</th>` +
      routeData.measures.map(m =>
        `<th class="${m.key === assessMeasure ? 'selcol' : 'dim'}">${m.short}</th>`).join('') +
    `</tr></thead><tbody>${rows}</tbody></table>
    <div class="rkey">
      <span><svg width="24" height="8"><line x1="1" y1="4" x2="23" y2="4"
        stroke="#777" stroke-width="4" stroke-linecap="round"/></svg> ridden</span>
      <span><svg width="24" height="8"><line x1="1" y1="4" x2="23" y2="4"
        stroke="#777" stroke-width="4" stroke-dasharray="4 3"/></svg> walked</span>
      <span><svg width="24" height="8"><line x1="1" y1="4" x2="23" y2="4"
        stroke="#777" stroke-width="2.5" stroke-linecap="round"
        stroke-dasharray="0.1 4.5"/></svg> connection</span>
    </div>
    <div style="font-size:10px;color:#666;margin:2px 0 6px">
      Distance compared with the 2000 m / 5000 m threshold; penalties are incurred by higher-stress riding (×1.25) and dismount (walking; ×3) . The no-dismount route (LSR) may not walk at all,
      so where it is longer or missing, that access depends on getting off and pushing the bike. Dotted legs join the sample point and the
      destination to the network and count at face value. Selected network route is highlighted and displayed on the map; &ldquo;—&rdquo; = not reachable.</div>
    <div class="q">
      <b>Under the assumptions of the selected &ldquo;${measLabel(assessMeasure)}&rdquo;
      network scenario &mdash; <span class="assume">${measAssume(assessMeasure)}</span>
      &mdash; do these routes provide a good representation of access to the closest
      destination up to ${limit} m?</b>
      <div class="yn">
        <label><input type="radio" name="ok" value="no"${a.ok === 'no' ? ' checked' : ''}> No</label>
        <label><input type="radio" name="ok" value="yes"${a.ok === 'yes' ? ' checked' : ''}> Yes</label>
      </div>
    </div>
    <fieldset id="issueBox" class="${needIssues(a.ok === 'no', a) ? 'need' : ''}"
      style="display:${a.ok === 'no' ? 'block' : 'none'}">
      <legend>Please select one or more issues</legend>${issuesHTML(a)}</fieldset>
    <fieldset id="commentBox"><legend>Comment (optional)</legend>
      <textarea id="assessComment" rows="2">${attr(a.comment || '')}</textarea>
    </fieldset>
    <div class="nudge" id="nudge"></div>
    <div class="nav">
      <button class="small" id="prevBtn"${assessIdx === 0 ? ' disabled' : ''}>Back</button>
      <button class="small" id="nextBtn">${assessIdx === routeData.points.length - 1 ? 'Go to Part B' : 'Next point'}</button>
    </div>`;
}

// The response unit is the point *and* the network scenario: the same point is
// judged once under each of the four, so the measures are compared within point.
function captureResponse() {
  if (!routeData || !assessMeasure) return;
  const pt = routeData.points[assessIdx];
  if (!pt || !document.querySelector('input[name="ok"]')) return;
  const okEl = document.querySelector('input[name="ok"]:checked');
  const ok = okEl ? okEl.value : '';
  // reasons belong to a "No": a Yes must not carry them, or the exported row
  // would contradict itself
  const why = ok === 'no' ? collectReasons() : { issues: [], dests: [] };
  const rec = {
    ok,
    issues: why.issues,
    dests: why.dests,
    comment: ($('assessComment') || {}).value || '',
  };
  const cell = resp.points[pt.id] || (resp.points[pt.id] = {});
  if (rec.ok || rec.issues.length || rec.dests.length || rec.comment) cell[assessMeasure] = rec;
  else delete cell[assessMeasure];
  saveResponses();
}

function stepProgress(pt) {
  $('assessProg').textContent =
    `Point ${assessIdx + 1} of ${nPoints()} (${pt.q}) · ` +
    `${pointAnswers(pt.id)} of ${nMeasures()} networks answered · ` +
    `${countA()} of ${nPoints() * nMeasures()} overall`;
}

function renderStep() {
  if (!routeData) return;
  nudged = false;
  const pt = routeData.points[assessIdx];
  stepProgress(pt);
  $('assessBody').innerHTML = stepHTML();
  drawStep();
  markProgress(donePoint(pt.id), assessMeasure);
  $('measCtl').onclick = e => {
    const b = e.target.closest('button[data-meas]');
    if (!b) return;
    captureResponse();
    assessMeasure = b.dataset.meas;
    syncDashboardNetwork();
    renderStep();
  };
  // Progressive disclosure: the reasons appear only on "No", without a re-render
  // so a part-typed comment is never lost. Answering also banks the response, so
  // the scenario shades complete and the ring moves on at the moment of the click
  // rather than waiting for the rater to navigate away — and a "No" only counts
  // once a reason is ticked, so the reasons are live too.
  const syncStep = () => {
    captureResponse();
    const rec = (resp.points[pt.id] || {})[assessMeasure] || {};
    $('issueBox').classList.toggle('need', needIssues(rec.ok === 'no', rec));
    markCommentNeed(rec.ok === 'no' ? rec : {});
    markProgress(donePoint(pt.id), assessMeasure);
    stepProgress(pt);
  };
  const cur = (resp.points[pt.id] || {})[assessMeasure] || {};
  markCommentNeed(cur.ok === 'no' ? cur : {});
  for (const el of document.querySelectorAll('input[name="ok"]'))
    el.onchange = () => {
      const isNo = el.value === 'no';
      if (!isNo) clearIssueTicks();
      $('issueBox').style.display = isNo ? 'block' : 'none';
      syncStep();
    };
  for (const el of document.querySelectorAll('input[name="issue"], input[name="dest"]'))
    el.onchange = syncStep;
  // the comment completes an "Other", so it is banked as it is typed
  $('assessComment').oninput = debounce(syncStep, 250);
  $('prevBtn').onclick = () => { captureResponse(); assessIdx--; goPoint(); };
  $('nextBtn').onclick = () => {
    captureResponse();
    const n = pointAnswers(pt.id);
    // soft nudge: say what is missing once, then let them go anyway
    if (n < nMeasures() && !nudged) {
      nudged = true;
      $('nudge').textContent = `Only ${n} of ${nMeasures()} network scenarios answered ` +
        'for this point — press again to continue anyway.';
      $('assessProg').textContent =
        `Point ${assessIdx + 1} of ${nPoints()} (${pt.q}) · ${n} of ${nMeasures()} ` +
        `networks answered · ${countA()} of ${nPoints() * nMeasures()} overall`;
      return;
    }
    if (assessIdx === nPoints() - 1) goStage('B');
    else { assessIdx++; goPoint(); }
  };
}

// move to the point at assessIdx, starting on its leftmost unanswered scenario
function goPoint() {
  resetMeasure(donePoint(routeData.points[assessIdx].id));
  renderStep();
}

// ---- export -----------------------------------------------------------------
// One tidy long-format table: one row per recorded judgement, tagged by `section`.
// Every rater x city file appends straight into a single master table, and the
// paired point x network design falls out of a filter on section = route_point.
const CSV_CATS = ['fresh_food_market', 'pt_frequent', 'public_open_space_large'];
const CSV_HEAD = ['rater', 'city', 'slug', 'codename', 'seed', 'generated', 'exported_at',
  'section', 'point_id', 'quadrant', 'lon', 'lat', 'pop',
  'network_key', 'network_label', 'item_group', 'item_key', 'item_label',
  'response', 'response_code', 'validity_code', 'applicability_code', 'importance_rank',
  'issues', 'dest_types', 'comment'].concat(
  CSV_CATS.flatMap(c => [`${c}_m`, `${c}_path_m`]));

// rd may be null when a city's routes JSON could not be re-read (export-all): the
// answers still export, without the distance columns.
function csvRows(r, rd, stamp) {
  const rows = [];
  const base = { rater: r.rater || '', city: rd ? rd.name : (r.name || ''),
                 slug: r.slug, codename: rd ? rd.codename : '',
                 seed: rd ? rd.seed : '', generated: rd ? rd.generated : '',
                 exported_at: stamp };
  const measKeys = rd ? rd.measures.map(m => m.key) : Object.keys(MEASURE_UI);

  const pts = rd ? rd.points
    : Object.keys(r.points).map(id => ({ id: isNaN(id) ? id : Number(id) }));
  for (const pt of pts)
    for (const mk of measKeys) {
      const a = (r.points[pt.id] || {})[mk] || {};
      const row = Object.assign({}, base, {
        section: 'route_point', point_id: pt.id, quadrant: pt.q, lon: pt.lon,
        lat: pt.lat, pop: pt.pop, network_key: mk, network_label: measLabel(mk),
        response: a.ok || '',
        response_code: a.ok === 'yes' ? 1 : a.ok === 'no' ? -1 : '',
        issues: (a.issues || []).join('|'), dest_types: (a.dests || []).join('|'),
        comment: a.comment || '' });
      for (const c of CSV_CATS) {
        const rt = rd && (rd.routes || []).find(
          x => x.p === pt.id && x.meas === mk && x.cat === c);
        row[`${c}_m`] = rt && rt.ok ? Math.round(rt.net) : '';
        row[`${c}_path_m`] = rt && rt.ok ? Math.round(rt.m) : '';
      }
      rows.push(row);
    }

  for (const mk of measKeys) {
    const o = r.overall[mk] || {};
    const code = o.r === undefined || o.r === '' ? '' : Number(o.r);
    rows.push(Object.assign({}, base, {
      section: 'network_overall', network_key: mk, network_label: measLabel(mk),
      response: code === '' ? '' : (TRI.find(t => t[0] === code) || ['', ''])[1].toLowerCase(),
      response_code: code,
      issues: (o.issues || []).join('|'), dest_types: (o.dests || []).join('|'),
      comment: o.comment || '' }));
  }

  for (const g of CHECKLIST) {
    const st = r.checklist[g.key] || { order: g.items.map(i => i.key), items: {} };
    st.order.forEach((ik, i) => {
      const it = g.items.find(x => x.key === ik) || { key: ik, label: ik };
      const v = (st.items || {})[ik] || {};
      rows.push(Object.assign({}, base, {
        section: 'checklist', item_group: g.key, item_key: ik, item_label: it.label,
        validity_code: g.rate && !it.other && v.v !== undefined && v.v !== '' ? Number(v.v) : '',
        applicability_code: g.rate && !it.other && v.a !== undefined && v.a !== '' ? Number(v.a) : '',
        importance_rank: i + 1, comment: v.comment || '' }));
    });
  }

  for (const [k, label] of FREE_TEXT)
    rows.push(Object.assign({}, base, {
      section: 'free_text', item_key: k, item_label: label,
      comment: (r.freeText || {})[k] || '' }));

  return rows;
}

function rowsToCSV(rows) {
  const esc = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
  return [CSV_HEAD.join(',')]
    .concat(rows.map(r => CSV_HEAD.map(h => esc(r[h])).join(',')))
    .join('\n');
}
function assessmentCSV() {
  return rowsToCSV(csvRows(resp, routeData, new Date().toISOString()));
}
function downloadCSV(text, name) {
  const blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function raterSlug() {
  return (resp.rater || 'anon').toLowerCase().replace(/[^a-z0-9]+/g, '-')
    .replace(/^-|-$/g, '') || 'anon';
}

// ================= stages =====================================================
// Every part lives in the side panel, so the map is available throughout. The parts
// are freely navigable — someone who only wants the checklist is not marched
// through twenty points to reach it.
const STAGES = [['start', 'Start'], ['A', 'A · Points'], ['B', 'B · Overall'],
                ['C', 'C · Aspects'], ['finish', 'Finish']];
function renderNav() {
  $('assessNav').innerHTML = STAGES.map(([k, l]) =>
    `<button data-stage="${k}"${k === assessStage ? ' class="on"' : ''}>${l}</button>`).join('');
  $('assessNav').onclick = e => {
    const b = e.target.closest('button[data-stage]');
    if (!b || b.dataset.stage === assessStage) return;
    captureStage();
    goStage(b.dataset.stage);
  };
}
// whatever the stage on screen holds, saved before leaving it
function captureStage() {
  if (assessStage === 'A') captureResponse();
  else if (assessStage === 'B') captureOverall();
  else if (assessStage === 'start') captureRater();
}
function goStage(s) {
  assessStage = s;
  nudged = false;
  renderNav();
  if (s === 'start') renderIntro();
  else if (s === 'A') goPoint();
  else if (s === 'B') { resetMeasure(doneOverall()); renderOverall(); }
  else if (s === 'C') renderChecklist();
  else renderFinish();
}

// ---- start ----
function firstUnanswered() {
  const i = routeData.points.findIndex(p => pointAnswers(p.id) < nMeasures());
  return i < 0 ? 0 : i;
}
function renderIntro() {
  const nA = nPoints() * nMeasures();
  $('assessProg').textContent = 'Answers are saved in this browser as you go';
  $('assessBody').innerHTML = `
    <div class="intro">
      <p><b>Part A — sample points.</b> For each of the ${nPoints()} sample points, select
      <b>each of the four network scenarios</b> in turn and answer the question below it.
      Toggle destinations, dismount priority links and the Level of Traffic Stress network
      in the left panel as you need. Four answers per point is a complete response
      (${nA} in all).</p>
      <p><b>Part B — overall.</b> One overall judgement per network scenario.</p>
      <p><b>Part C — aspects.</b> Rate the parts of the method against your city's context.</p>
      <p>Download the file at the end and email it to the research team.</p>
    </div>
    <fieldset><legend>Your name or initials</legend>
      <input type="text" id="raterName" value="${attr(resp.rater || '')}"
             placeholder="recorded against every response"></fieldset>
    <table class="rt"><thead><tr><th class="l">Progress</th><th>Done</th><th>Of</th></tr></thead>
      <tbody>
        <tr><td class="l">A · point × network</td><td>${countA()}</td><td>${nA}</td></tr>
        <tr><td class="l">B · overall by network</td><td>${countB()}</td><td>${nMeasures()}</td></tr>
        <tr><td class="l">C · aspects rated</td><td>${countC()}</td><td>${totalC()}</td></tr>
      </tbody></table>
    <div class="nav">
      <button class="small" id="beginBtn">${countA() ? 'Resume Part A' : 'Begin Part A'}</button>
    </div>
    <div class="nav"><button class="small" id="exitBtn">Exit activity</button></div>`;
  $('raterName').oninput = captureRater;
  $('beginBtn').onclick = () => {
    captureRater();
    if (countA()) assessIdx = firstUnanswered();
    goStage('A');
  };
  $('exitBtn').onclick = () => { captureRater(); exitAssessment(); };
}
function captureRater() {
  const el = $('raterName');
  if (el) { resp.rater = el.value.trim(); saveResponses(); }
}

// ---- Part B: one verdict per network for the city as a whole ----
// The same scenario buttons as Part A, one question at a time. The question and
// the options are identical across the four, so asking them four times down the
// panel only made the part longer; answering advances to the next unanswered one.
function renderOverall() {
  const done = doneOverall();
  if (!assessMeasure || !routeData.measures.some(m => m.key === assessMeasure))
    assessMeasure = (routeData.measures.find(m => !done.has(m.key))
      || routeData.measures[0]).key;
  const o = resp.overall[assessMeasure] || {};
  const isNo = Number(o.r) === -1;
  const opts = YN.map(([v, l]) =>
    `<label><input type="radio" name="ov_${assessMeasure}" value="${v}"` +
    `${String(o.r) === String(v) ? ' checked' : ''}> ${l}</label>`).join('');
  $('assessProg').textContent =
    `Part B — ${countB()} of ${nMeasures()} network scenarios answered`;
  $('assessBody').innerHTML = `
    <p class="hintline">Having looked at the sample points, give one judgement per network
    scenario for the city as a whole.</p>
    ${netBtnsHTML(assessMeasure)}
    <div class="q"><b>Overall, is the representation of access to all destinations under
      the &ldquo;${measLabel(assessMeasure)}&rdquo; scenario &mdash;
      <span class="assume">${measAssume(assessMeasure)}</span> &mdash;
      sufficiently accurate?</b>
      <div class="yn">${opts}</div></div>
    <fieldset id="issueBox" class="${needIssues(isNo, o) ? 'need' : ''}"
      style="display:${isNo ? 'block' : 'none'}">
      <legend>Please select one or more reasons</legend>${issuesHTML(o)}</fieldset>
    <fieldset id="commentBox"><legend>Comment (optional)</legend>
      <textarea rows="2" name="ovc_${assessMeasure}">${attr(o.comment || '')}</textarea>
    </fieldset>
    <div class="nav">
      <button class="small" id="prevBtn">Back to Part A</button>
      <button class="small" id="nextBtn">Go to Part C</button>
    </div>`;
  markProgress(done, assessMeasure);
  $('measCtl').onclick = e => {
    const b = e.target.closest('button[data-meas]');
    if (!b) return;
    captureOverall();
    assessMeasure = b.dataset.meas;
    syncDashboardNetwork();
    renderOverall();
  };
  // A complete answer moves on to the next unanswered scenario; a "No" waits
  // where it is until a reason is ticked, exactly as Part A does.
  const syncOverall = advance => {
    captureOverall();
    const rec = resp.overall[assessMeasure] || {};
    $('issueBox').classList.toggle('need', needIssues(Number(rec.r) === -1, rec));
    markCommentNeed(Number(rec.r) === -1 ? rec : {});
    const state = doneOverall();
    $('assessProg').textContent =
      `Part B — ${countB()} of ${nMeasures()} network scenarios answered`;
    if (advance && state.has(assessMeasure)) {
      const left = routeData.measures.find(m => !state.has(m.key));
      if (left) { assessMeasure = left.key; syncDashboardNetwork(); }
      renderOverall();
      return;
    }
    markProgress(state, assessMeasure);
  };
  for (const el of document.querySelectorAll(`input[name="ov_${assessMeasure}"]`))
    el.onchange = () => {
      const isNo = Number(el.value) === -1;
      if (!isNo) clearIssueTicks();
      $('issueBox').style.display = isNo ? 'block' : 'none';
      syncOverall(true);
    };
  for (const el of document.querySelectorAll('input[name="issue"], input[name="dest"]'))
    el.onchange = () => syncOverall(false);
  markCommentNeed(isNo ? o : {});
  document.querySelector(`textarea[name="ovc_${assessMeasure}"]`).oninput =
    debounce(() => syncOverall(false), 250);
  $('prevBtn').onclick = () => { captureOverall(); goStage('A'); };
  $('nextBtn').onclick = () => { captureOverall(); goStage('C'); };
}
function captureOverall() {
  if (!routeData) return;
  for (const m of routeData.measures) {
    const el = document.querySelector(`input[name="ov_${m.key}"]:checked`);
    const ta = document.querySelector(`textarea[name="ovc_${m.key}"]`);
    if (!el && !ta) continue;
    // only one scenario is ever on screen, so the ticked reasons are its own;
    // as in Part A, they are kept only for a "No"
    const r = el ? Number(el.value) : '';
    const why = r === -1 ? collectReasons() : { issues: [], dests: [] };
    const rec = { r, issues: why.issues, dests: why.dests, comment: ta ? ta.value : '' };
    if (rec.r !== '' || rec.comment || rec.issues.length) resp.overall[m.key] = rec;
    else delete resp.overall[m.key];
  }
  saveResponses();
}

// ---- Part C: validity, applicability and importance ----
// In the side panel like Parts A and B, so the map stays available while a rater
// judges whether the method suits their city. Each scale is a three-way switch
// rather than a dropdown: one click instead of two, and narrow enough that both
// scales fit beside the label at 330px.
function checkProgress() {
  $('assessProg').textContent = `Part C — ${countC()} of ${totalC()} aspects rated`;
}

// the hover sentence on each scale heading, echoing the instructions at the top
const SCALE_HELP = {
  v: 'Considering your city\'s context and the needs of bike users, rate the validity ' +
     'for policy, practice and research of each aspect.',
  a: 'Considering your city\'s context and the needs of bike users, rate the applicability ' +
     'for policy, practice and research of each aspect.',
};

function renderChecklist() {
  const scaleHead = (t, f, second) =>
    `<span class="ck-sc${second ? ' ck-c2' : ''}" title="${attr(SCALE_HELP[f])}">${t}</span>`;
  const groups = CHECKLIST.map(g => {
    const st = resp.checklist[g.key];
    const rows = st.order.map((ik, i) => {
      const it = g.items.find(x => x.key === ik) || { key: ik, label: ik, help: '' };
      const v = (st.items || {})[ik] || {};
      const sw = (f, second) => `<span class="ck-sw${second ? ' ck-c2' : ''}" data-f="${f}">` +
        TRI.map(([c, l]) =>
          `<button data-v="${c}"${String(v[f]) === String(c) ? ' class="sel"' : ''}` +
          `${c === 0 ? ' title="Unsure"' : ''}>${c === 0 ? '?' : l}</button>`).join('') +
        '</span>';
      // the "other" row is ranked like the rest, but has nothing to rate: its
      // comment is the group's comment box below the rows
      const cells = !g.rate ? ''
        : it.other ? '<span class="ck-na">&ndash;</span><span class="ck-na ck-c2">&ndash;</span>'
        : sw('v') + sw('a', true);
      return `<div class="ck-row" data-i="${ik}">` +
        `<span class="rk-n">${i + 1}</span>` +
        '<span class="ck-grip" title="Drag to reorder">&#10303;</span>' +
        `<span class="ck-lab ck-help" title="${attr(it.help)}">${it.label}</span>` +
        cells + '</div>';
    }).join('');
    const head = '<div class="ck-head"><span class="ck-rank-h">Rank</span>' +
      `<span class="ck-lab">${g.rate ? 'Aspect' : 'Format'}</span>` +
      (g.rate ? scaleHead('Valid?', 'v') + scaleHead('Applicable?', 'a', true) : '') + '</div>';
    const comment = ((st.items || {}).other || {}).comment || '';
    return `<h3>${g.title}</h3><p class="ghint">${g.hint}</p>${head}` +
      `<div class="ck-rows" data-g="${g.key}">${rows}</div>` +
      `<textarea class="ck-other" rows="2" data-g="${g.key}" data-i="other" data-f="comment"` +
      ` placeholder="Comment on ${g.title.toLowerCase()}">${attr(comment)}</textarea>`;
  }).join('');
  const free = FREE_TEXT.map(([k, label]) =>
    `<h3>${label}</h3><textarea class="ck-other" rows="3" data-free="${k}"` +
    `>${attr((resp.freeText || {})[k] || '')}</textarea>`).join('');
  $('assessBody').innerHTML = `
    <p class="hintline">Considering your city's context and the needs of bike users, rate the
    <b>validity</b> and <b>applicability</b> for policy, practice and research of each aspect,
    and rank them by <b>importance</b> for safe cycling policy, advocacy and research in
    your city.</p>
    <p class="ghint">Importance is ranked within each heading &mdash; <b>drag a row</b> up or
    down, most important first. Hover any item for what it means in this analysis.</p>
    ${groups}${free}
    <div class="nav">
      <button class="small" id="prevBtn">Back to Part B</button>
      <button class="small" id="nextBtn">Finish</button>
    </div>`;
  $('prevBtn').onclick = () => goStage('B');
  $('nextBtn').onclick = () => goStage('finish');
  checkProgress();
}

// ---- finish ----
function renderFinish() {
  const nA = nPoints() * nMeasures();
  const per = routeData.measures.map(m => {
    let ans = 0, yes = 0;
    for (const pt of routeData.points) {
      const a = (resp.points[pt.id] || {})[m.key];
      if (answered(a)) { ans++; if (a.ok === 'yes') yes++; }
    }
    const o = resp.overall[m.key] || {};
    const ov = o.r === undefined || o.r === '' ? '–'
      : (TRI.find(t => t[0] === Number(o.r)) || ['', '–'])[1];
    return `<tr><td class="l">${measLabel(m.key)}</td><td>${ans}</td>` +
      `<td>${ans ? Math.round(100 * yes / ans) + '%' : '–'}</td><td>${ov}</td></tr>`;
  }).join('');
  // most-cited issues: a first read on where the method fails
  const tally = {};
  for (const p of Object.values(resp.points))
    for (const a of Object.values(p))
      for (const k of a.issues || []) tally[k] = (tally[k] || 0) + 1;
  for (const o of Object.values(resp.overall))
    for (const k of o.issues || []) tally[k] = (tally[k] || 0) + 1;
  const top = Object.entries(tally).sort((a, b) => b[1] - a[1]).slice(0, 4)
    .map(([k, n]) => `<li>${(ISSUE_OPTIONS.find(o => o[0] === k) || ['', k])[1]} — ${n}</li>`)
    .join('');
  // the export is held back until every part is answered: a partial file read as
  // a complete one would silently weaken the paired comparison
  const done = activityComplete();
  $('assessProg').textContent =
    `A ${countA()}/${nA} · B ${countB()}/${nMeasures()} · C ${countC()}/${totalC()}`;
  $('assessBody').innerHTML = `
    <p class="hintline">${done ? 'Thank you &mdash; that is everything.' : 'Almost there.'}
    Download your responses and email the file to the research team, or copy them to
    paste into a message.</p>
    <table class="rt"><thead><tr><th class="l">Network scenario</th><th>Part A</th>
      <th>Good</th><th>Part B</th></tr></thead><tbody>${per}</tbody></table>
    <div class="hintline">Part A: points answered, and the share judged a good
      representation. Part B: your overall verdict.</div>
    ${top ? `<fieldset><legend>Most-cited issues</legend>
      <ul style="margin:2px 0 0 14px;padding:0;font-size:11.5px">${top}</ul></fieldset>` : ''}
    <div class="nav"${done ? '' : ` title="${attr(outstandingText())}"`}>
      <button class="small" id="dlBtn"${done ? '' : ' disabled'}>Download CSV</button>
      <button class="small" id="copyBtn"${done ? '' : ' disabled'}>Copy</button>
    </div>
    ${done ? '' : `<div class="nudge">${outstandingText()}</div>`}
    <div class="nav">
      <button class="small" id="backBtn">Back to Part A</button>
      <button class="small" id="exitBtn2">Exit activity</button>
    </div>`;
  $('dlBtn').onclick = () =>
    downloadCSV(assessmentCSV(), `cycling_validation_${resp.slug}_${raterSlug()}.csv`);
  $('copyBtn').onclick = async () => {
    const text = assessmentCSV();
    try { await navigator.clipboard.writeText(text); }
    catch {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
    }
    $('copyBtn').textContent = 'Copied ✓';
    setTimeout(() => { $('copyBtn').textContent = 'Copy'; }, 1500);
  };
  $('backBtn').onclick = () => { assessIdx = 0; goStage('A'); };
  $('exitBtn2').onclick = exitAssessment;
}

function startAssessment() {
  if (!routeData) return;
  // adding sources/layers before the style is ready throws, so wait it out if
  // the button is pressed while a city is still loading
  if (!map || !map.isStyleLoaded()) {
    if (map) map.once('idle', startAssessment);
    return;
  }
  loadResponses(slug);
  assessIdx = 0;
  // each part sets the scenario as it opens (leftmost unanswered); this is only
  // the seed for the start screen
  assessMeasure = routeData.measures[0].key;
  $('assessTitle').textContent = `${routeData.name}: validation activity`;
  document.body.classList.add('assessing');
  // the vertical collapse control always sits in the top-right of the whole
  // panel, so it moves into the assessment half while that is open
  $('assessHeader').appendChild($('panelToggle'));
  ensureAssessLayers();
  // hide the grid choropleth so routes read clearly
  if (map.getLayer('grid')) map.setLayoutProperty('grid', 'visibility', 'none');
  // Two layers are the standing context for judging a route: the destinations show
  // where the closest ones actually are, and the dismount priority links explain a
  // continuous route that includes walking. Turn both on, remembering what the rater
  // had so exiting puts it back. Setting .checked does not fire the change handlers,
  // so the map state is applied directly.
  preAssessLayers = { dest: $('destChk').checked, dismount: $('dismountChk').checked };
  $('destChk').checked = true;
  if ((manifests[slug].layers || {}).dismount && map.getLayer('dismount')) {
    $('dismountChk').checked = true;
    map.setLayoutProperty('dismount', 'visibility', 'visible');
  }
  updateOverlays();
  goStage('start');
}

function exitAssessment() {
  document.body.classList.remove('assessing', 'legend-collapsed');
  $('legendToggle').innerHTML = '&#9664;';
  if ($('panelToggle').parentElement !== $('panelHeader'))
    $('panelHeader').appendChild($('panelToggle'));
  assessLabels.forEach(mk => mk.remove());
  assessLabels = [];
  assessStage = 'start';
  if (!map) return;
  if (map.getSource('assess'))
    map.getSource('assess').setData({ type: 'FeatureCollection', features: [] });
  // restore the layers the assessment hid or switched on
  if (preAssessLayers) {
    $('destChk').checked = preAssessLayers.dest;
    $('dismountChk').checked = preAssessLayers.dismount;
    if (map.getLayer('dismount'))
      map.setLayoutProperty('dismount', 'visibility',
        preAssessLayers.dismount ? 'visible' : 'none');
    preAssessLayers = null;
  }
  if (map.getLayer('grid'))
    map.setLayoutProperty('grid', 'visibility',
      $('gridChk').checked ? 'visible' : 'none');
  updateOverlays();
}

// ---- optional distance measuring tool ----
// A scratch ruler for collaborators' own reference. Click successive points to
// accumulate distance. This measures straight-line (great-circle) distance
// between the clicks, NOT network distance -- it is for reading the map's scale
// and sanity-checking the indicator distances, not for reproducing them.
let measuring = false, measurePts = [], measureLabels = [];

function haversineM(a, b) {
  const R = 6371008.8, rad = Math.PI / 180;
  const dLat = (b[1] - a[1]) * rad, dLng = (b[0] - a[0]) * rad;
  const h = Math.sin(dLat / 2) ** 2 +
            Math.cos(a[1] * rad) * Math.cos(b[1] * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
// running total at each vertex, so vertex i can be labelled with the distance
// walked to get there
function measureCumulative() {
  const out = [0];
  for (let i = 1; i < measurePts.length; i++)
    out.push(out[i - 1] + haversineM(measurePts[i - 1], measurePts[i]));
  return out;
}

function ensureMeasureLayers() {
  if (!map || map.getSource('measure')) return;
  // addSource throws while the style is still loading (e.g. a click that lands
  // during a city switch), so defer the drawing until the style settles. The
  // vertices and their labels are unaffected, being plain DOM markers.
  if (!map.isStyleLoaded()) {
    map.once('idle', () => { ensureMeasureLayers(); renderMeasure(); });
    return;
  }
  map.addSource('measure', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({ id: 'measure_halo', type: 'line', source: 'measure',
    filter: ['==', ['geometry-type'], 'LineString'],
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#fff', 'line-width': 5, 'line-opacity': 0.9 } });
  map.addLayer({ id: 'measure_line', type: 'line', source: 'measure',
    filter: ['==', ['geometry-type'], 'LineString'],
    layout: { 'line-join': 'round' },
    paint: { 'line-color': '#111', 'line-width': 2, 'line-dasharray': [2, 1.6] } });
  map.addLayer({ id: 'measure_pts', type: 'circle', source: 'measure',
    filter: ['==', ['geometry-type'], 'Point'],
    paint: { 'circle-radius': 4, 'circle-color': '#fff',
             'circle-stroke-color': '#111', 'circle-stroke-width': 2 } });
}

function setMeasuring(on) {
  measuring = on;
  document.body.classList.toggle('measuring', on);
  // a double-click would otherwise zoom the map while dropping two vertices
  if (map) on ? map.doubleClickZoom.disable() : map.doubleClickZoom.enable();
}

function renderMeasure() {
  const cum = measureCumulative();
  const feats = measurePts.map((c, i) => ({ type: 'Feature', properties: { i },
    geometry: { type: 'Point', coordinates: c } }));
  if (measurePts.length > 1)
    feats.push({ type: 'Feature', properties: {},
      geometry: { type: 'LineString', coordinates: measurePts } });
  if (map && map.getSource('measure'))
    map.getSource('measure').setData({ type: 'FeatureCollection', features: feats });

  // annotate each vertex with the running total (HTML markers, as for the routes)
  measureLabels.forEach(mk => mk.remove());
  measureLabels = measurePts.map((c, i) => {
    const el = document.createElement('div');
    el.className = 'maplbl';
    el.style.borderColor = '#111';
    el.textContent = i === 0 ? 'Start' : `${Math.round(cum[i]).toLocaleString()} m`;
    return new maplibregl.Marker({ element: el, anchor: 'bottom-left', offset: [6, -6] })
      .setLngLat(c).addTo(map);
  });

  const total = cum[cum.length - 1] || 0;
  $('measureBox').style.display = (measuring || measurePts.length) ? 'block' : 'none';
  $('measureTotal').textContent = `${Math.round(total).toLocaleString()} m`;
  const bits = [];
  if (measurePts.length > 1) {
    const leg = total - cum[cum.length - 2];
    bits.push(`${(total / 1000).toFixed(2)} km straight-line`);
    bits.push(`${measurePts.length} points · last leg ${Math.round(leg).toLocaleString()} m`);
  } else if (measuring) {
    bits.push(measurePts.length ? 'Click the next point.'
                                : 'Click points on the map to measure.');
  }
  if (!measuring && measurePts.length) bits.push('<i>Paused — press Resume to add more.</i>');
  $('measureSub').innerHTML = bits.join('<br>');
  $('mDone').textContent = measuring ? 'Done' : 'Resume';
  $('measureBtn').classList.toggle('on', measuring);
  $('measureBtn').textContent = measuring ? 'Measuring…' : 'Measure distance (m)';
}

function addMeasurePoint(lngLat) {
  ensureMeasureLayers();
  measurePts.push([lngLat.lng, lngLat.lat]);
  renderMeasure();
}
function clearMeasure() {
  measurePts = [];
  setMeasuring(false);
  renderMeasure();
}

// Part C saves as you go, by delegation. These are bound once, to #assessBody
// itself — only its innerHTML is ever replaced — so a re-render cannot lose an
// answer or a handler. Both are keyed on the Part C data attributes, so nothing
// here fires for the Part A/B fields that share the container.
$('assessBody').addEventListener('change', e => {
  const d = e.target.dataset || {};
  if (d.free !== undefined) { resp.freeText[d.free] = e.target.value; saveResponses(); }
  else if (d.g) {
    const st = resp.checklist[d.g];
    if (!st) return;
    (st.items[d.i] || (st.items[d.i] = {}))[d.f] = e.target.value;
    saveResponses();
  }
});
// the three-way switches: clicking the selected cell again clears it, so an
// answer given by accident can be taken back without a "–" option to aim at
$('assessBody').addEventListener('click', e => {
  const b = e.target.closest('.ck-sw button');
  if (!b) return;
  const sw = b.parentElement;
  const row = sw.closest('.ck-row');
  const st = resp.checklist[row.parentElement.dataset.g];
  if (!st) return;
  const it = st.items[row.dataset.i] || (st.items[row.dataset.i] = {});
  const f = sw.dataset.f;
  it[f] = String(it[f] === undefined ? '' : it[f]) === b.dataset.v ? '' : b.dataset.v;
  saveResponses();
  for (const o of sw.children) o.classList.toggle('sel', o.dataset.v === it[f]);
  checkProgress();
});
// Importance is ranked by dragging a row within its own heading. Pointer events
// rather than HTML5 drag and drop, so it works the same under touch; the list is
// reordered live and the record is written once, on drop.
(function initRankDrag() {
  let drag = null;
  const body = $('assessBody');
  body.addEventListener('pointerdown', e => {
    const row = e.target.closest('.ck-row');
    if (!row || e.target.closest('.ck-sw')) return;
    drag = { row, list: row.parentElement, moved: false };
    row.setPointerCapture(e.pointerId);
    row.classList.add('dragging');
  });
  // the rank number stays with its position while the rest of the row moves past
  const renumber = list =>
    [...list.children].forEach((r, i) => { r.querySelector('.rk-n').textContent = i + 1; });
  body.addEventListener('pointermove', e => {
    if (!drag) return;
    for (const r of drag.list.children) {
      if (r === drag.row) continue;
      const box = r.getBoundingClientRect();
      const mid = box.top + box.height / 2;
      const after = r.compareDocumentPosition(drag.row) & Node.DOCUMENT_POSITION_FOLLOWING;
      if (e.clientY < mid && after) { drag.list.insertBefore(drag.row, r); drag.moved = true; }
      else if (e.clientY > mid && !after) { drag.list.insertBefore(drag.row, r.nextSibling); drag.moved = true; }
      else continue;
      renumber(drag.list);
      break;
    }
  });
  const drop = () => {
    if (!drag) return;
    drag.row.classList.remove('dragging');
    if (drag.moved) {
      const st = resp.checklist[drag.list.dataset.g];
      st.order = [...drag.list.children].map(r => r.dataset.i);
      saveResponses();
      renderChecklist();
    }
    drag = null;
  };
  body.addEventListener('pointerup', drop);
  body.addEventListener('pointercancel', drop);
})();

$('mDone').onclick = () => { setMeasuring(!measuring); renderMeasure(); };

// Three vertical steps rather than a toggle, so the panel can be got out of the
// way by degrees: everything -> indicator controls hidden -> header only.
(function initPanelCollapse() {
  const panel  = document.getElementById('panel');
  const toggle = document.getElementById('panelToggle');

  if (!panel || !toggle) return;

  const STEPS = [
    { cls: [],                        glyph: '⭫', tip: 'Hide the indicator selection details' },
    { cls: ['collapsed'],             glyph: '◀', tip: 'Hide the legend and buttons too' },
    { cls: ['collapsed', 'collapsed2'], glyph: '⭱', tip: 'Show the whole panel again' },
  ];
  let level = 0;

  toggle.addEventListener('click', () => {
    level = (level + 1) % STEPS.length;
    panel.classList.remove('collapsed', 'collapsed2');
    panel.classList.add(...STEPS[level].cls);
    toggle.textContent = STEPS[level].glyph;
    toggle.title = STEPS[level].tip;
  });
})();

})();
